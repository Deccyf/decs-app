<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#1F3A5F" id="themeColor">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Dec's Tracker</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231F3A5F'/%3E%3Ctext x='32' y='43' font-family='Arial' font-weight='800' font-size='30' fill='%232A9D8F' text-anchor='middle'%3ED%3C/text%3E%3C/svg%3E">
<style>
/* ===================================================================
   Design tokens. Every colour is a variable so the dark theme is a
   token swap, not a second stylesheet.
   =================================================================== */
:root{
  --brand:#1F3A5F; --brand-2:#2C5488; --on-brand:#FFFFFF;
  --teal:#2A9D8F; --amber:#E9C46A; --coral:#E76F51; --forest:#3A8F5C; --slate:#264653; --violet:#6C5CE7;
  --bg:#F4F7FB; --bg-2:#E8EEF6;
  --card:#FFFFFF; --card-2:#F3F6FA; --card-brd:transparent;
  --ink:#101828; --ink-2:#344054; --muted:#667085; --line:#E4E9F0; --line-2:#D3DBE6;
  --good:#1E7F4B; --good-bg:#E3F4EA; --warn:#8A6D1F; --warn-bg:#FDF1D6; --bad:#B42318; --bad-bg:#FDE7E4;
  --fld:#FFFFFF; --fld-brd:#CFD8E4; --chip:#E6ECF4; --chip-ink:#1F3A5F;
  --sh-1:0 1px 2px rgba(16,24,40,.05); --sh-2:0 1px 2px rgba(16,24,40,.05),0 10px 24px -18px rgba(16,24,40,.35);
  --sh-3:0 10px 34px -12px rgba(16,24,40,.28);
  --r-xs:8px; --r-sm:10px; --r:14px; --r-lg:18px; --r-xl:24px; --r-full:999px;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Roboto Mono",monospace;
  --tap:44px;
}
:root[data-theme="dark"]{
  --brand:#5B8FC7; --brand-2:#7BA9DA; --on-brand:#0B1220;
  --teal:#3FBFAE; --amber:#EBC46B; --coral:#F08163; --forest:#4FB075; --slate:#7A9AA6; --violet:#8E7DF2;
  --bg:#0C1119; --bg-2:#121A26;
  --card:#151D29; --card-2:#1B2634; --card-brd:#222E3F;
  --ink:#E9EEF6; --ink-2:#C2CCDA; --muted:#8B98AC; --line:#232F41; --line-2:#2E3D52;
  --good:#5CCB8E; --good-bg:#16301F; --warn:#E3BE6B; --warn-bg:#332A12; --bad:#F98A7B; --bad-bg:#3A1B18;
  --fld:#111927; --fld-brd:#2E3D52; --chip:#1D2836; --chip-ink:#C2CCDA;
  --sh-1:none; --sh-2:none; --sh-3:0 12px 30px -14px rgba(0,0,0,.7);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --brand:#5B8FC7; --brand-2:#7BA9DA; --on-brand:#0B1220;
    --teal:#3FBFAE; --amber:#EBC46B; --coral:#F08163; --forest:#4FB075; --slate:#7A9AA6; --violet:#8E7DF2;
    --bg:#0C1119; --bg-2:#121A26;
    --card:#151D29; --card-2:#1B2634; --card-brd:#222E3F;
    --ink:#E9EEF6; --ink-2:#C2CCDA; --muted:#8B98AC; --line:#232F41; --line-2:#2E3D52;
    --good:#5CCB8E; --good-bg:#16301F; --warn:#E3BE6B; --warn-bg:#332A12; --bad:#F98A7B; --bad-bg:#3A1B18;
    --fld:#111927; --fld-brd:#2E3D52; --chip:#1D2836; --chip-ink:#C2CCDA;
    --sh-1:none; --sh-2:none; --sh-3:0 12px 30px -14px rgba(0,0,0,.7);
  }
}

/* ===================================================================
   Base
   =================================================================== */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;font:16px/1.45 var(--sans);color:var(--ink);background:var(--bg);
  padding-bottom:calc(78px + env(safe-area-inset-bottom));-webkit-tap-highlight-color:transparent}
body.notabs{padding-bottom:24px}
:where(a){color:var(--brand)}
::selection{background:color-mix(in srgb,var(--teal) 30%,transparent)}

/* Focus: one consistent ring everywhere, never removed. */
:where(button,input,select,textarea,summary,[tabindex]):focus-visible{
  outline:2px solid var(--teal);outline-offset:2px;border-radius:var(--r-xs)}

/* ===================================================================
   Header — sticky, condenses on scroll
   =================================================================== */
header{position:sticky;top:0;z-index:6;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
  display:flex;align-items:center;gap:12px;
  background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px) saturate(1.4);
  -webkit-backdrop-filter:blur(14px) saturate(1.4);border-bottom:1px solid transparent;transition:border-color .2s}
header.stuck{border-bottom-color:var(--line)}
.hgrp{min-width:0;flex:1}
h1{margin:0;font-size:23px;font-weight:800;letter-spacing:-.025em;color:var(--ink);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{color:var(--muted);font-size:12.5px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:38px;height:38px;flex:0 0 38px;border:1px solid var(--line);border-radius:var(--r-full);
  background:var(--card);color:var(--ink-2);display:grid;place-items:center;padding:0;cursor:pointer}
.iconbtn:active{transform:scale(.94)}
.iconbtn svg{width:19px;height:19px}

main{padding:2px 12px 20px;max-width:760px;margin:0 auto}
@media (min-width:700px){header{max-width:760px;margin:0 auto}}

/* ===================================================================
   Cards & type
   =================================================================== */
.card{background:var(--card);border:1px solid var(--card-brd);border-radius:var(--r-lg);
  padding:16px;margin:12px 0;box-shadow:var(--sh-2)}
.card h2{margin:0 0 4px;font-size:16.5px;font-weight:800;color:var(--ink);letter-spacing:-.015em;
  display:flex;align-items:center;gap:8px;justify-content:space-between}
.card h2 .hint{flex:0 0 auto;font-weight:600;font-size:12px;color:var(--muted);letter-spacing:0;text-align:right}
.eyebrow{font-size:10.5px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.muted{color:var(--muted);font-size:13.5px}
.small{font-size:12px}
.note{color:var(--muted);font-size:12.5px;line-height:1.5;margin-top:10px}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.mono{font-family:var(--mono);font-size:13px}
.neg{color:var(--bad)}.pos{color:var(--good)}
.strong{font-weight:800;font-size:18px}
.sep{height:1px;background:var(--line);margin:14px 0}

/* ===================================================================
   Tiles
   =================================================================== */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.tile{position:relative;border-radius:var(--r-lg);padding:13px 14px 12px;color:#fff;min-height:98px;
  display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;isolation:isolate}
.tile::after{content:"";position:absolute;inset:0;z-index:-1;
  background:linear-gradient(150deg,rgba(255,255,255,.16),rgba(255,255,255,0) 62%)}
.tile .cap{font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;opacity:.88}
.tile .val{font-size:25px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;
  line-height:1.1;margin:7px 0 3px;overflow-wrap:anywhere}
.tile .val.sm{font-size:17px}
.tile .tsub{font-size:12px;opacity:.92;line-height:1.35}
.navy{background:var(--brand);color:var(--on-brand)}
.teal{background:var(--teal);color:#06231F}
.amber{background:var(--amber);color:#3A2E0B}
.coral{background:var(--coral);color:#3A1408}

/* ===================================================================
   Rows / lists
   =================================================================== */
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .l{min-width:0;flex:1}
.row .l b{display:block;overflow-wrap:anywhere;font-weight:700}
.row .l small,.meta{display:block;color:var(--muted);font-size:12px;line-height:1.4;margin-top:1px}
.empty{color:var(--muted);font-size:13.5px;padding:20px 0;text-align:center}

/* ===================================================================
   Forms
   =================================================================== */
input,select,textarea,button{font:inherit;color:var(--ink)}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:11.5px;color:var(--muted);font-weight:700;letter-spacing:.01em}
.field input,.field select,.field textarea{border:1px solid var(--fld-brd);border-radius:var(--r-sm);
  padding:11px 12px;background:var(--fld);width:100%;min-width:0;min-height:var(--tap)}
.field textarea{min-height:0}
.field input:disabled{background:var(--card-2);color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:end}
.full{grid-column:1/-1}
.check{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:14px;cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--teal);flex:0 0 22px}
/* A number that may be negative: the ± button flips the sign, for keypads with no minus key */
.signed{display:flex;gap:6px;align-items:stretch}
.signed input{flex:1;min-width:0}
.signed .sgn{flex:0 0 48px;border:1px solid var(--fld-brd);background:var(--card-2);border-radius:var(--r-sm);
  font-size:19px;font-weight:800;color:var(--ink-2);cursor:pointer;min-height:var(--tap);padding:0;line-height:1}
.signed .sgn.on{background:var(--bad-bg);border-color:var(--bad-bg);color:var(--bad)}
.signed .sgn:active{transform:scale(.95)}

/* Switch — used for the optional bill-shift settings */
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
.switch:last-child{border-bottom:0}
.switch .sl{min-width:0}
.switch .sl b{display:block;font-size:14px;font-weight:700}
.switch .sl small{display:block;color:var(--muted);font-size:12px;line-height:1.4;margin-top:1px}
.switch input{position:absolute;opacity:0;width:0;height:0}
.switch .track{flex:0 0 46px;width:46px;height:28px;border-radius:var(--r-full);background:var(--line-2);
  position:relative;transition:background .18s}
.switch .track::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;
  background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .18s}
.switch input:checked+.track{background:var(--teal)}
.switch input:checked+.track::after{transform:translateX(18px)}
.switch input:focus-visible+.track{outline:2px solid var(--teal);outline-offset:2px}

/* Segmented control — the "optional button" for weekend/bank-holiday shifting */
.seg{display:flex;background:var(--card-2);border-radius:var(--r-sm);padding:3px;gap:3px;
  border:1px solid var(--line)}
.seg button{flex:1;border:0;background:none;color:var(--muted);font-size:12.5px;font-weight:700;
  padding:9px 6px;border-radius:calc(var(--r-sm) - 2px);cursor:pointer;min-height:0;white-space:nowrap;
  transition:background .15s,color .15s}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:var(--sh-1)}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{background:var(--brand);color:var(--on-brand)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .seg button[aria-pressed="true"]{background:var(--brand);color:var(--on-brand)}}

/* Stepper */
.hours{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0 14px}
.step{display:flex;align-items:stretch;border:1px solid var(--fld-brd);border-radius:var(--r-sm);
  overflow:hidden;background:var(--fld)}
.step button{flex:0 0 46px;border:0;background:var(--card-2);font-size:22px;color:var(--brand);font-weight:700;cursor:pointer}
.step button:active{background:var(--line)}
.step input{flex:1;border:0;text-align:center;font-size:21px;font-weight:800;font-variant-numeric:tabular-nums;
  width:100%;min-width:0;padding:11px 0;background:var(--fld);-moz-appearance:textfield}
.step input::-webkit-inner-spin-button,.step input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}

/* Buttons */
.btn{border:0;background:var(--brand);color:var(--on-brand);font-weight:700;padding:11px 16px;
  border-radius:var(--r-sm);font-size:14px;cursor:pointer;min-height:var(--tap);display:inline-flex;
  align-items:center;justify-content:center;gap:7px}
.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--chip);color:var(--chip-ink)}
.btn.teal{background:var(--teal);color:#06231F}
.btn.danger{background:var(--bad-bg);color:var(--bad)}
.btn.sm{padding:8px 12px;font-size:13px;min-height:36px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.del{border:0;background:none;color:var(--muted);font-size:22px;line-height:1;padding:6px 10px;cursor:pointer;
  min-height:var(--tap);min-width:var(--tap)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 12px}
.chip{border:0;padding:9px 13px;border-radius:var(--r-full);background:var(--chip);color:var(--chip-ink);
  font-size:13px;font-weight:700;cursor:pointer}
.chip.on{background:var(--brand);color:var(--on-brand)}
.status{border:0;padding:7px 12px;border-radius:var(--r-full);font-size:12px;font-weight:800;
  background:var(--chip);color:var(--chip-ink);white-space:nowrap;cursor:pointer;min-height:34px}
.status.Done{background:var(--good-bg);color:var(--good)}
.status.Inprogress{background:var(--warn-bg);color:var(--warn)}

/* ===================================================================
   Pay
   =================================================================== */
.payhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.payhead .big{font-size:24px;font-weight:800;color:var(--ink);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.results{margin-top:6px}
.results .r{display:flex;justify-content:space-between;gap:12px;padding:7px 0;
  border-bottom:1px dashed var(--line);font-size:14px}
.results .r span:first-child{color:var(--ink-2)}
.results .r.total{border:0;border-top:2px solid var(--brand);margin-top:5px;padding-top:11px;font-size:18px;font-weight:800}
.results .r.extra{background:var(--good-bg);color:var(--good);margin:8px -16px -16px;padding:12px 16px;border:0;
  border-radius:0 0 var(--r-lg) var(--r-lg);font-weight:700}
.results .r.extra .muted{color:inherit;opacity:.75}
.results .r.extra small{display:block;font-weight:600;font-size:12px;opacity:.8}
.tag{display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:.1em;padding:3px 7px;
  border-radius:var(--r-xs);background:var(--teal);color:#06231F;vertical-align:middle;margin-left:7px}

.board .brow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:11px 0;
  border-bottom:1px solid var(--line);cursor:pointer;text-align:left;width:100%;border-left:0;border-right:0;
  border-top:0;background:none;color:inherit;font:inherit}
.board .brow .d{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--ink);white-space:nowrap}
.board .brow .pr{font-family:var(--mono);font-size:11.5px;color:var(--muted);white-space:nowrap;margin-top:2px}
.board .brow .h{font-size:12.5px;color:var(--ink-2)}
.board .brow .n{font-variant-numeric:tabular-nums;font-weight:700;text-align:right;white-space:nowrap}
.board .brow.past .d,.board .brow.past .n{color:var(--muted);font-weight:600}
.board .brow.sel{background:var(--card-2);margin:0 -16px;padding:11px 16px;border-radius:var(--r-sm)}
.board .brow.nextpd{background:var(--good-bg);margin:0 -16px;padding:11px 16px;border-radius:var(--r-sm)}
.yearhdr{display:flex;width:100%;justify-content:space-between;align-items:center;gap:10px;border:0;
  background:none;padding:16px 0 9px;border-bottom:2px solid var(--line);font-weight:800;font-size:15px;
  color:var(--ink);text-align:left;cursor:pointer}
.yearhdr .ym{display:flex;align-items:center;gap:10px;font-weight:600;font-size:12px;color:var(--muted)}
.yearhdr i{font-style:normal;font-weight:800;font-size:17px;line-height:1;color:var(--chip-ink);width:26px;
  height:26px;border-radius:var(--r-xs);background:var(--chip);display:grid;place-items:center}
.yearhdr[aria-expanded="true"] i{background:var(--brand);color:var(--on-brand)}

/* ===================================================================
   Cash flow (new)
   =================================================================== */
.flowhero{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:2px 0 10px}
.flowhero .amt{font-size:34px;font-weight:800;letter-spacing:-.035em;font-variant-numeric:tabular-nums;line-height:1}
.flowhero .amt.neg{color:var(--bad)}
.flowhero .per{text-align:right;font-size:13px;color:var(--muted)}
.flowhero .per b{display:block;font-size:17px;color:var(--ink);font-variant-numeric:tabular-nums}
.sparkwrap{margin:12px 0 4px}
.spark{display:block;width:100%;height:66px;overflow:visible}
.ledger{margin-top:6px}
.lrow{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;padding:9px 0;
  border-bottom:1px solid var(--line)}
.lrow:last-child{border-bottom:0}
.lrow .ld{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--ink-2);text-align:center;
  background:var(--card-2);border-radius:var(--r-xs);padding:5px 2px;line-height:1.15}
.lrow .ld span{display:block;font-size:9.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.lrow.pay .ld{background:var(--good-bg);color:var(--good)}
.lrow.pay .ld span{color:var(--good)}
.lrow .ln{min-width:0}
.lrow .ln b{display:block;font-size:14px;font-weight:700;overflow-wrap:anywhere}
.lrow .ln small{display:block;color:var(--muted);font-size:11.5px;margin-top:1px}
.lrow .lv{text-align:right;font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.lrow .lv small{display:block;font-weight:600;color:var(--muted);font-size:11.5px}
.lrow.gone{opacity:.6}.lrow.gone .lv{color:var(--muted);font-weight:600}
.moved{display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
  padding:2px 6px;border-radius:var(--r-xs);background:var(--warn-bg);color:var(--warn);margin-left:6px;vertical-align:1px}
.perrow{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:11px 0;border-bottom:1px solid var(--line);align-items:center}
.perrow:last-child{border-bottom:0}
.perrow .pb{grid-column:1/-1}

/* ===================================================================
   Progress bars, ticks, tables
   =================================================================== */
.bar{height:8px;border-radius:var(--r-full);background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--forest);border-radius:var(--r-full);transition:width .3s}
.bar.teal i{background:var(--teal)}.bar.amber i{background:var(--amber)}.bar.coral i{background:var(--coral)}
.prow{display:grid;grid-template-columns:1fr auto;gap:6px 10px;padding:9px 0;border-bottom:1px solid var(--line);align-items:center}
.prow:last-child{border-bottom:0}.prow .bar{grid-column:1/-1}
.tick{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.tick .box{width:28px;height:28px;border-radius:var(--r-xs);border:2px solid var(--fld-brd);flex:0 0 28px;
  display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;background:var(--fld);cursor:pointer;padding:0}
.tick.on .box{background:var(--forest);border-color:var(--forest)}
.tick .name{flex:1;min-width:0;overflow-wrap:anywhere;cursor:pointer;font-size:14.5px;padding:6px 0}
.tick.on .name{color:var(--muted)}
.tick .g{font-size:11px;font-weight:800;color:var(--chip-ink);background:var(--chip);border:0;border-radius:var(--r-xs);
  padding:6px 9px;white-space:nowrap;cursor:pointer}
.tick .g.has{background:var(--warn-bg);color:var(--warn)}
.psm{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.psm .t{font-size:12px;color:var(--muted);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.psm .box{width:46px;height:34px;border-radius:var(--r-xs);border:2px solid var(--fld-brd);display:grid;
  place-items:center;font-size:11px;font-weight:800;color:var(--muted);background:var(--fld);cursor:pointer}
.psm .box.on{background:var(--forest);border-color:var(--forest);color:#fff}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card-2);border-radius:var(--r);padding:12px 8px;text-align:center}
.stat b{display:block;font-size:23px;font-weight:800;color:var(--ink);letter-spacing:-.025em;font-variant-numeric:tabular-nums}
.stat span{font-size:10.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.table{width:100%;border-collapse:collapse;font-size:13px}
.table th{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:right;
  padding:7px 5px;border-bottom:1px solid var(--line);font-weight:800}
.table td{padding:9px 5px;text-align:right;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
.table th:first-child,.table td:first-child{text-align:left}
.table tr:last-child td{border-bottom:0}
.tscroll{overflow-x:auto;margin:0 -16px;padding:0 16px;-webkit-overflow-scrolling:touch}
.mrow{padding:12px 0;border-bottom:1px solid var(--line)}.mrow:last-child{border-bottom:0}
.mhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px}
.mhead b{font-size:15px}.mhead .disp{font-weight:800;font-variant-numeric:tabular-nums}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.erow{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding:12px 0;border-bottom:1px solid var(--line);align-items:end}
.erow:last-of-type{border-bottom:0}
.yearhead{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin:16px 0 2px}
details{border-top:1px solid var(--line);margin-top:12px;padding-top:2px}

  display:flex;justify-content:space-between;gap:10px;font-size:14.5px}

  font-size:12px;color:var(--ink-2)}

   Bottom navigation
   =================================================================== */

  padding:6px 0 3px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;

  stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:var(--brand)}
.tabs button.on svg{stroke-width:2.2}

/* ===================================================================
   Toast & dialog
   =================================================================== */
.toast{position:fixed;left:50%;bottom:calc(94px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(6px);
  background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:var(--r-full);font-size:14px;font-weight:700;

dialog::backdrop{background:rgba(8,12,20,.55);backdrop-filter:blur(3px)}

.dlg h3{margin:0 0 6px;font-size:17px;font-weight:800;letter-spacing:-.015em}
.dlg p{margin:0 0 14px;color:var(--muted);font-size:13.5px;line-height:1.5}
.dlg .btnrow{justify-content:flex-end;margin-top:16px}

.lockwrap{position:fixed;inset:0;z-index:20;background:var(--bg);display:grid;place-items:center;padding:24px}
/* a class selector beats the UA's [hidden]{display:none}, so say it explicitly */
.lockwrap[hidden]{display:none}
.lockcard{width:100%;max-width:320px;text-align:center;display:flex;flex-direction:column;gap:12px}
.lockmark{width:64px;height:64px;margin:0 auto 4px;border-radius:20px;background:var(--brand);color:var(--on-brand);

  width:100%;text-align:center;font-size:24px;letter-spacing:.35em;font-variant-numeric:tabular-nums;min-height:56px}
.lockcard input::placeholder{letter-spacing:.35em;opacity:.35}
.lockerr{color:var(--bad);font-size:13px;font-weight:700;min-height:18px}

  text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:8px;margin-top:4px}

  @keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
}

function showDialog({ title, body = '', ok = 'OK', cancel = 'Cancel', danger = false, input = null, inputType = 'text' }) {

    f.innerHTML = `<h3>${esc(title)}</h3>${body ? `<p>${body}</p>` : ''}

    const done = () => {
      d.removeEventListener('close', done);

/* Shows the lock screen and resolves once the PIN decrypts the blob. */
function unlockScreen(blob) {
  return new Promise(resolve => {
    const wrap = $('#lock'), form = $('#lockForm'), input = $('#pinIn'), err = $('#lockErr'), go = $('#lockGo');
    document.body.classList.add('locked');
    wrap.hidden = false;
    $('#lockTitle').textContent = document.title;
    let attempts = 0, busy = false;
    setTimeout(() => input.focus(), 50);
    form.onsubmit = async e => {
      e.preventDefault();
      if (busy) return;
      const pin = input.value;
      if (!pin) { input.focus(); return; }
      busy = true; go.disabled = true; err.textContent = ''; go.textContent = 'Unlocking…';
      try {
        const opened = await openBlob(blob, pin);
        const data = JSON.parse(opened.text);
        if (!data || !data.pay || !data.money) throw new Error('not the app\u2019s data');
        cryptoKey = opened.key; cryptoSalt = opened.salt;
        S = data;
        wrap.hidden = true; document.body.classList.remove('locked');
        form.onsubmit = null;
        resolve();
      } catch (e2) {
        attempts++;
        err.textContent = attempts > 2 ? `That PIN didn\u2019t work (${attempts} tries)` : 'That PIN didn\u2019t work';
        input.value = ''; input.focus();
        // slow repeated guesses down a little; PBKDF2 already makes each one cost
        await new Promise(r => setTimeout(r, Math.min(attempts * 400, 3000)));
      } finally { busy = false; go.disabled = false; go.textContent = 'Unlock'; }
    };
  });
}

/* ---------------- turning the PIN on, changing it, turning it off ---------------- */
async function askPin(title, body, ok) {
  const v = await dialog({ title, body, ok: ok || 'Continue', input: '', inputType: 'password' });
  return v === null ? null : String(v).trim();
}
async function setPin() {
  if (!CRYPTO_OK) { toast('This browser cannot encrypt'); return; }
  const ready = await dialog({
    title: 'Before you set a PIN',
    body: 'The data on this device gets encrypted with it. <b>If you forget the PIN it cannot be recovered</b> — not by us, not by anyone. Download a backup first and keep it somewhere safe.',
    ok: 'Download a backup', cancel: 'Cancel'
  });
  if (!ready) return;
  exportBackup();
  const one = await askPin('Choose a PIN', 'Six digits or more. Longer is harder to guess — a word or phrase works too.', 'Next');
  if (one === null) return;
  if (one.length < 6) { toast('Use at least 6 characters'); return; }
  const two = await askPin('Type it again', 'Just to be sure you have it right.', 'Turn on PIN lock');
  if (two === null) return;
  if (one !== two) { toast("Those didn't match — nothing changed"); return; }
  cryptoSalt = crypto.getRandomValues(new Uint8Array(16));
  cryptoKey = await deriveKey(one, cryptoSalt);
  await save();
  render();
  toast('PIN lock on');
}
async function changePin() {
  const one = await askPin('New PIN', 'Six digits or more.', 'Next');
  if (one === null) return;
  if (one.length < 6) { toast('Use at least 6 characters'); return; }
  const two = await askPin('Type it again', '', 'Change PIN');
  if (two === null) return;
  if (one !== two) { toast("Those didn't match — nothing changed"); return; }
  cryptoSalt = crypto.getRandomValues(new Uint8Array(16));
  cryptoKey = await deriveKey(one, cryptoSalt);
  await save();
  toast('PIN changed');
}
async function clearPin() {
  const yes = await dialog({ title: 'Turn off the PIN lock?',
    body: 'Your figures go back to being stored unencrypted on this device, readable by anyone who can unlock the phone.',
    ok: 'Turn it off', danger: true });
  if (!yes) return;
  cryptoKey = null; cryptoSalt = null;
  await save();
  render();
  toast('PIN lock off');
}

/* ---------- sparkline: projected balance between now and pay day ---------- */
function sparkline(series) {
  if (!series || series.length < 2) return '';
  const w = 600, h = 66, pad = 5;
  const vals = series.map(s => s.bal);
  const lo0 = Math.min(...vals), hi0 = Math.max(...vals), neg = lo0 < 0;
  // scale to the data with a little headroom; only pull in zero when the balance actually goes under
  const room = (hi0 - lo0) * 0.18 || Math.max(Math.abs(hi0) * 0.08, 1);
  const min = neg ? lo0 - room : Math.max(0, lo0 - room), max = hi0 + room * 0.5, span = (max - min) || 1;
  const X = i => pad + (w - pad * 2) * i / (series.length - 1);
  const Y = v => pad + (h - pad * 2) * (1 - (v - min) / span);
  const line = series.map((s, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)} ${Y(s.bal).toFixed(1)}`).join(' ');
  const area = `${line} L${X(series.length - 1).toFixed(1)} ${h - pad} L${pad} ${h - pad} Z`;
  const last = series[series.length - 1];
  const hue = neg ? 'var(--coral)' : 'var(--teal)';
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img"
      aria-label="Projected balance from ${esc(C.fmtD(series[0].date))} to ${esc(C.fmtD(last.date))}">
    <defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${hue}" stop-opacity=".28"/>
      <stop offset="100%" stop-color="${hue}" stop-opacity="0"/></linearGradient></defs>
    ${neg ? `<line x1="${pad}" y1="${Y(0).toFixed(1)}" x2="${w - pad}" y2="${Y(0).toFixed(1)}"
      stroke="var(--bad)" stroke-width="1" stroke-dasharray="4 4" vector-effect="non-scaling-stroke" opacity=".7"/>` : ''}
    <path d="${area}" fill="url(#sg)"/>
    <path d="${line}" fill="none" stroke="${hue}" stroke-width="2"
      stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
    <circle cx="${X(series.length - 1).toFixed(1)}" cy="${Y(last.bal).toFixed(1)}" r="3.2"
      fill="var(--card)" stroke="${hue}" stroke-width="2" vector-effect="non-scaling-stroke"/>
  </svg>`;
}

            <div class="h">${x.ot || x.sun ? `${x.ot ? x.ot + 'h overtime' : ''}${x.ot && x.sun ? ' · ' : ''}${x.sun ? x.sun + 'h Sunday' : ''}` : '<span class="muted">—</span>'}${x.hpaPay ? '<div class="muted small">+ EU Holiday Pay ' + C.gbp(x.hpaPay, 0) + '</div>' : ''}${x.backpay ? '<div class="muted small">+ backpay ' + C.gbp(x.backpay, 0) + '</div>' : ''}</div>
            <div class="n">${C.gbp(x.net, 0)}${x.extraGross ? `<div class="muted small">+${C.gbp(x.extra, 0)}</div>` : ''}</div></button>`).join('');
        }).join('');
      })()}
      <div class="row" style="margin-top:8px"><div class="l"><b>Tax year ${esc(p.taxYear)}</b><small>${p.totals.ot}h overtime · ${p.totals.sun}h Sunday · ${C.gbp(p.totals.extraGross, 0)} gross extra</small></div><div class="num" style="text-align:right"><b>${C.gbp(p.totals.net, 0)}</b><div class="muted small">+${C.gbp(p.totals.extra, 0)} overtime</div></div></div>
    </div>`;
    h += `<div class="card"><h2>EU Holiday Pay</h2><div class="muted small" style="margin-bottom:4px">Southeastern's Holiday Pay Adjustment: 4/52 of a calendar year's overtime and Sunday pay, paid on the first pay day in March of the next year. Taxed and NI'd like normal pay.</div>
      ${p.hpa.filter(y => y.received != null || y.qualifying > 0 || y.year === C.today().slice(0, 4)).map(y => `<div class="row"><div class="l"><b>${esc(y.year)}</b><small>${y.received != null ? 'received ' + (y.payday ? esc(C.fmtD(y.payday)) : '') : (y.qualifying != null ? C.gbp(y.qualifying) + ' qualifying · ' + y.logged + ' of ' + y.periods + ' periods with hours · due ' + (y.payday ? esc(C.fmtD(y.payday)) : 'March ' + (+y.year + 1)) : '')}</small></div>
        <div class="num" style="text-align:right"><b>${C.gbp(y.gross)}</b>${y.gross ? `<div class="muted small">≈ ${C.gbp(y.net, 0)} after tax</div>` : ''}</div></div>`).join('') || '<div class="empty">Log some hours and the estimate appears here.</div>'}
      <div class="note">What counts: overtime, rest day working, Sunday working/premiums, night and higher-grade payments. Basic pay and London Allowance don't. The estimate only covers periods with hours logged here.</div></div>`;
    h += paySettings(p);
    if (PAY_ONLY) h += backupCard('Backup', `Tax and NI rates are HMRC's 2026/27 figures (England, Wales & NI, category A). Update them in Settings each April.`);
    return { title: PAY_ONLY ? (SEED.title || 'Pay') : 'Pay', sub: `${C.gbp(p.hourly)}/hr · 4-weekly`, html: h };
  },

  money() {
    const m = C.moneyCalc(S.money), p = C.payCalc(S.pay), opt = flowOpt();
    const fl = C.runway(S.money, p, opt);
    const flows = C.periodFlows(S.money, p, opt, ui.flowPeriods);
    const cur = m.thisMonthKey;
    const months = m.months.filter(x => ui.showAllMonths || x.month <= C.addMonths(cur + '-01', 1).slice(0, 7)).slice().reverse();

    /* --- 1. cash flow to the next pay day --- */
    let h = `<div class="card"><h2>Left until pay day<span class="hint">${fl.days} day${fl.days === 1 ? '' : 's'} · ${esc(C.fmtDM(fl.to))}</span></h2>`;
    if (fl.hasBal) {
      h += `<div class="flowhero"><div><div class="amt ${fl.safe < 0 ? 'neg' : ''}">${C.gbp(fl.safe)}</div>
          <div class="muted small">free to spend, keeping your ${C.gbp(fl.buffer, 0)} buffer</div></div>
        ${fl.perDay != null && fl.safe > 0 ? `<div class="per"><b>${C.gbp(fl.perDay)}</b>a day</div>` : ''}</div>
        <div class="sparkwrap">${sparkline(fl.series)}</div>
        <div class="results">
          <div class="r"><span>${fl.wasCarried ? 'Estimated balance today' : 'Balance today'}</span><span class="num">${C.gbp(fl.start)}</span></div>
          <div class="r"><span>${fl.events.length ? `${fl.events.length} bill${fl.events.length === 1 ? '' : 's'} still to leave` : 'No bills left before pay day'}</span><span class="num${fl.events.length ? ' neg' : ' muted'}">${fl.events.length ? '-' + C.gbp(fl.outgoings) : '—'}</span></div>
          <div class="r"><span>Balance the morning of pay day</span><span class="num">${C.gbp(fl.atPayday)}</span></div>
          ${fl.net != null ? `<div class="r"><span>Pay in ${esc(C.fmtDM(fl.to))}</span><span class="num pos">+${C.gbp(fl.net)}</span></div>
          <div class="r total"><span>Balance after pay</span><span class="num">${C.gbp(fl.afterPay)}</span></div>` : ''}
        </div>`;
      if (fl.shortfall) h += `<div class="banner bad"><b>Short before pay day.</b> The balance dips to ${C.gbp(fl.low.bal)} on ${esc(C.fmtD(fl.low.date))} — move something, or the direct debit bounces.</div>`;
      else if (fl.low && fl.low.bal < fl.buffer) h += `<div class="banner"><b>It gets tight.</b> Lowest point is ${C.gbp(fl.low.bal)} on ${esc(C.fmtD(fl.low.date))}, under your ${C.gbp(fl.buffer, 0)} buffer.</div>`;
    } else {
      h += `<div class="banner info">Put today's bank balance in below and this works out what's genuinely free to spend before ${esc(C.fmtD(fl.to))} — bills counted on the day they actually leave.</div>
        <div class="results"><div class="r"><span>${fl.events.length ? `${fl.events.length} bill${fl.events.length === 1 ? '' : 's'} still to leave` : 'No bills left before pay day'}</span><span class="num${fl.events.length ? ' neg' : ' muted'}">${fl.events.length ? '-' + C.gbp(fl.outgoings) : '—'}</span></div>
        ${fl.net != null ? `<div class="r"><span>Pay in ${esc(C.fmtDM(fl.to))}</span><span class="num pos">+${C.gbp(fl.net)}</span></div>` : ''}</div>`;
    }
    h += `${fl.wasCarried ? `<div class="note" style="margin-top:2px">Carried forward from the <b>${C.gbp(fl.typed)}</b> you entered on ${esc(C.fmtD(fl.typedOn))}${fl.carriedOut ? `, less <b>${C.gbp(fl.carriedOut)}</b> of bills` : ''}${fl.carriedIn ? `, plus <b>${C.gbp(fl.carriedIn)}</b> of pay` : ''} since.</div>` : ''}
      ${fl.wasCarried ? detailsBlock('carried', `What's come off since ${C.fmtDM(fl.typedOn)}`,
        `<div class="ledger">${fl.carried.map(e => ledgerRow(e, null, true)).join('')}${fl.carriedPays.map(r => `<div class="lrow gone"><div class="ld"><span>${esc(C.DOW[C.dow(r.payday)])}</span>${+r.payday.slice(8)}</div>
          <div class="ln"><b>Pay day</b><small>${esc(C.fmtM(C.mkey(r.payday)))}</small></div><div class="lv pos">+${C.gbp(r.net)}</div></div>`).join('')}</div>
         <div class="note">Only bills and pay are counted here. Day-to-day spending isn't — so retype your balance whenever you check the bank, and the running total starts again from that figure.</div>`) : ''}
      <div class="grid2" style="margin-top:14px">${field(fl.typedOn ? `Balance (${C.fmtDM(fl.typedOn)})` : 'Bank balance today', signedInp('money.balance', S.money.balance, 'placeholder="e.g. 1240.50"'))}${field('Buffer to keep back', inp('money.buffer', S.money.buffer))}</div>
      <div class="note">Retype this whenever you check your bank — the running total restarts from whatever you enter, and bills come off again as the days pass. Overdrawn? Type the amount, then tap <b>+</b> beside it to flip it to <b>−</b>.</div>
      ${fl.staleDays >= 14 ? `<div class="banner" style="margin-top:12px"><b>That balance is ${fl.staleDays} days old.</b> Only bills have come off it since — anything you've actually spent hasn't. Check your bank and retype it.</div>` : ''}
      ${m.undated ? `<div class="banner" style="margin-top:12px"><b>${m.undated === 1 ? 'One bill has' : m.undated + ' bills have'} no payment date.</b> ${m.undated === 1 ? "It's" : "They're"} missing from these figures — add the day of the month ${m.undated === 1 ? 'it leaves' : 'each one leaves'} under Bills below.</div>` : ''}
      ${fl.events.length ? `<div class="sep"></div><div class="eyebrow">Every payment between now and pay day</div><div class="ledger">${
        (() => { let bal = fl.hasBal ? fl.start : null;
          return fl.events.map(e => { if (bal !== null) bal = C.r2(bal - e.amount); return ledgerRow(e, bal); }).join('')
            + (fl.net != null ? `<div class="lrow pay"><div class="ld"><span>${esc(C.DOW[C.dow(fl.to)])}</span>${+fl.to.slice(8)}</div>
              <div class="ln"><b>Pay day</b><small>${esc(C.fmtM(C.mkey(fl.to)))}</small></div>
              <div class="lv pos">+${C.gbp(fl.net)}${fl.hasBal ? `<small>${C.gbp(fl.afterPay)}</small>` : ''}</div></div>` : ''); })()
      }</div>` : ''}
      <div class="sep"></div>${flowOptions()}</div>`;

    /* --- 2. disposable income per pay period --- */
    h += `<div class="card"><h2>Disposable by pay period<span class="hint">from bill dates</span></h2>
      <div class="muted small">You're paid every 28 days but bills come out monthly, so some periods carry two of the same bill and some carry none. This counts what actually leaves inside each period.</div>
      <div style="margin-top:10px">${flows.map(f => {
        const dupes = {}; f.events.forEach(e => { dupes[e.name] = (dupes[e.name] || 0) + 1; });
        const twice = Object.keys(dupes).filter(k => dupes[k] > 1);
        const share = f.net > 0 ? Math.min(f.outgoings / f.net, 1) : 0;
        return `<div class="perrow"><div><b>${esc(C.fmtDM(f.from))} – ${esc(C.fmtDM(f.to))}</b>
            <small class="meta">${C.gbp(f.net, 0)} in · ${C.gbp(f.outgoings, 0)} out · ${f.events.length} bills${twice.length ? ' · twice: ' + esc(twice.join(', ')) : ''}</small></div>
          <div class="num" style="text-align:right"><b class="${f.disposable < 0 ? 'neg' : ''}" style="font-size:17px">${C.gbp(f.disposable, 0)}</b>
            <div class="muted small">${C.pct(share)} on bills</div></div>
          <div class="pb">${bar(share, share > 0.85 ? 'coral' : share > 0.7 ? 'amber' : 'teal')}</div></div>`;
      }).join('') || '<div class="empty">Add bill payment dates and your pay details to see this.</div>'}</div>
      ${flows.length ? `<div class="btnrow"><button class="btn ghost sm" data-act="morePeriods">${ui.flowPeriods >= 12 ? 'Show fewer' : 'Show more periods'}</button></div>` : ''}
      ${flows.length ? `<div class="note">Average disposable across these ${flows.length} periods: <b>${C.gbp(C.r2(flows.reduce((a, f) => a + f.disposable, 0) / flows.length))}</b>. Bills that stop or start are honoured, and linked debt repayments follow the debt list.</div>` : ''}</div>`;

    /* --- 3. history --- */
    h += `<div class="card"><h2>By year</h2><div class="tscroll"><table class="table"><tr><th>Year</th><th>Earnings</th><th>Bills</th><th>Disposable</th><th>Saved</th><th>Rate</th></tr>
      ${m.byYear.filter(y => y.n || y.saved).map(y => `<tr><td>${y.year}</td><td>${C.gbp(y.earnings, 0)}</td><td>${C.gbp(y.outgoings, 0)}</td><td>${C.gbp(y.disposable, 0)}</td><td>${C.gbp(y.saved, 0)}</td><td>${C.pct(y.rate)}</td></tr>`).join('') || '<tr><td colspan="6" class="muted">No months filled in yet.</td></tr>'}</table></div>
      <div class="chartwrap"><canvas id="chart"></canvas></div><div class="chartkey"><span><i style="background:var(--brand)"></i>Earnings</span><span><i style="background:var(--teal)"></i>Disposable</span><span class="muted">last 12 months — swipe to see them all</span></div></div>`;
    h += `<div class="card"><h2>Month by month</h2><div class="muted small">Type earnings and what you actually saved. Bills and disposable work themselves out.</div>
      ${months.map(x => { const i = S.money.months.findIndex(q => q.month === x.month); return `<div class="mrow"><div class="mhead"><b>${esc(C.fmtM(x.month))}</b><span class="disp ${x.disposable < 0 ? 'neg' : ''}">${x.has ? C.gbp(x.disposable) : '<span class="muted" style="font-weight:600">no earnings yet</span>'}</span></div>
        <div class="mgrid">${field('Earnings', inp(`money.months.${i}.earnings`, x.earnings))}${field('Actually saved', signedInp(`money.months.${i}.saved`, x.saved))}</div>
        ${x.has ? `<div class="note">Bills ${C.gbp(x.outgoings)} · potential savings ${C.gbp(x.potential)} (disposable minus the ${C.gbp(S.money.buffer, 0)} buffer)</div>` : ''}</div>`; }).join('') || '<div class="empty">No months yet.</div>'}
      <div class="btnrow"><button class="btn ghost sm" data-act="toggle" data-key="showAllMonths">${ui.showAllMonths ? 'Show fewer months' : 'Show all months'}</button><button class="btn sm" data-act="addMonth">Add ${esc(C.fmtM(nextMonthKey()))}</button></div></div>`;

    /* --- 4. bills --- */
    h += `<div class="card"><h2>Bills</h2><div class="row"><div class="l"><b>Active bills total</b><small>${m.active.length} bills · ${m.dated.length} with a payment date</small></div><div class="strong num">${C.gbp(m.activeTotal)}</div></div>
      ${ui.editBills ? m.bills.map((b, i) => `<div class="erow">${field('Bill', inp(`money.bills.${i}.name`, b.name, 'text'))}${field('Category', sel(`money.bills.${i}.category`, b.category, CATS))}
          ${field(b.link ? 'Amount (linked to ' + b.link.toLowerCase() + ' debt repayments)' : 'Amount', b.link ? `<input type="text" value="${C.gbp(b.amt)}" disabled>` : inp(`money.bills.${i}.amount`, b.amount))}
          ${field('Day of month it leaves', inp(`money.bills.${i}.dueDay`, b.dueDay, 'number', 'min="1" max="31" step="1" placeholder="1–31"'))}
          ${field('Started', inp(`money.bills.${i}.started`, b.started, 'month'))}${field('Ended (blank = still paying)', inp(`money.bills.${i}.ended`, b.ended, 'month'))}
          <div class="full"><button class="btn danger sm" data-act="delBill" data-i="${i}">Remove ${esc(b.name || 'bill')}</button></div></div>`).join('') || '<div class="empty">No bills yet.</div>'
        : m.bills.map(b => `<div class="row"><div class="l"><b>${esc(b.name)}</b><small>${esc(b.category || '')}${C.num(b.dueDay) ? ' · ' + esc(C.ord(Math.round(C.num(b.dueDay)))) + ' of the month' : ' · <span style="color:var(--warn)">no date set</span>'}${b.ended ? ' · ended ' + esc(C.fmtM(b.ended)) : ''}${b.link ? ' · linked to debts' : ''}</small></div><div class="num ${b.ended ? 'muted' : ''}">${C.gbp(b.amt)}</div></div>`).join('') || '<div class="empty">No bills yet.</div>'}
      <div class="btnrow"><button class="btn ghost sm" data-act="toggle" data-key="editBills">${ui.editBills ? 'Done' : 'Edit bills'}</button>${ui.editBills ? '<button class="btn sm" data-act="addBill">Add bill</button>' : ''}</div>
      ${(() => { const cats = Object.entries(m.byCat).filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1]);
        return cats.length > 1 ? `<div class="sep"></div><div class="eyebrow">Where it goes each month</div>
          ${cats.map(([k, v]) => `<div class="prow"><span><b>${esc(k)}</b></span><span class="num muted small">${C.gbp(v, 0)} · ${C.pct(v / m.activeTotal)}</span>${bar(v / m.activeTotal, 'teal')}</div>`).join('')}` : ''; })()}
      <div class="note">The day of the month is what makes the cash flow above work. Use 31 for "last day" — short months fall back to the 28th, 29th or 30th automatically. Change an amount and the app offers to keep the old price, which is what builds the Price changes card below.</div></div>`;

    /* --- 4b. what bills have done over time --- */
    const hist = C.priceHistory(S.money.bills);
    if (hist.length) {
      const monthly = C.r2(hist.reduce((a, x) => a + x.total, 0));
      const recent = hist.filter(x => x.last.month >= C.mkey(C.addMonths(C.today(), -12)));
      h += `<div class="card"><h2>Price changes<span class="hint">${hist.length} bill${hist.length === 1 ? '' : 's'}</span></h2>
        <div class="row"><div class="l"><b>${monthly >= 0 ? 'More' : 'Less'} than when you started tracking</b><small>across ${hist.length} bill${hist.length === 1 ? '' : 's'} that have changed price</small></div>
          <div class="num" style="text-align:right"><b class="${monthly > 0 ? 'neg' : 'pos'}" style="font-size:18px">${monthly > 0 ? '+' : ''}${C.gbp(monthly)}</b><div class="muted small">${monthly > 0 ? '+' : ''}${C.gbp(monthly * 12, 0)} a year</div></div></div>
        ${hist.map(x => `<div class="prow"><div><b>${esc(x.name)}</b>
            <small class="meta">${C.gbp(x.first)} ${esc(C.fmtMs(x.since))} → ${C.gbp(x.current)} now${x.changes.length > 1 ? ` · ${x.changes.length} changes` : ''}</small></div>
          <div class="num" style="text-align:right"><b class="${x.total > 0 ? 'neg' : 'pos'}">${x.total > 0 ? '+' : ''}${C.gbp(x.total)}</b>
            <div class="muted small">${esc(C.fmtMs(x.last.month))} ${x.last.diff > 0 ? '+' : ''}${C.gbp(x.last.diff)}</div></div>
          <div class="pb">${(() => { const w = hist.reduce((m, y) => Math.max(m, Math.abs(y.total)), 0) || 1;
            return bar(Math.abs(x.total) / w, x.total > 0 ? 'coral' : 'teal'); })()}</div></div>`).join('')}
        ${recent.length ? `<div class="note">${recent.length === 1 ? 'One bill has' : recent.length + ' bills have'} changed in the last year: ${esc(recent.map(x => x.name).join(', '))}.</div>` : ''}
        <div class="note">Built from the history you keep when a price changes. Edit a bill's amount and the app offers to keep the old one — that is what fills this in.</div></div>`;
    }

    /* --- 5. debt --- */
    h += `<div class="card"><h2>Debt</h2><div class="row"><div class="l"><b>Total owed</b><small>${C.gbp(m.repayTotal)} a month in repayments</small></div><div class="strong num">${C.gbp(m.debtTotal)}</div></div>
      ${ui.editDebts ? m.debts.map((d, i) => `<div class="erow">${field('Debt', inp(`money.debts.${i}.name`, d.name, 'text'))}${field('Type', sel(`money.debts.${i}.type`, d.type, ['Short-term', 'Long-term']))}
          ${field('Balance', inp(`money.debts.${i}.balance`, d.balance))}${field('Monthly repayment', inp(`money.debts.${i}.repayment`, d.repayment))}
          ${field('APR % (optional)', pctInp(`money.debts.${i}.apr`, d.apr))}<div class="full"><button class="btn danger sm" data-act="delDebt" data-i="${i}">Remove ${esc(d.name || 'debt')}</button></div></div>`).join('') || '<div class="empty">No debts. Nice.</div>'
        : m.debts.map(d => `<div class="row"><div class="l"><b>${esc(d.name)}</b><small>${esc(d.type)} · ${C.gbp(d.repayment)}/month${d.payoff ? d.payoff.never ? ' · repayment below interest' : ' · clear by ' + esc(C.fmtM(d.payoff.date)) + (d.payoff.naive ? ' (no interest)' : '') : ''}</small></div><div class="num">${C.gbp(d.balance)}</div></div>`).join('') || '<div class="empty">No debts. Nice.</div>'}
      <div class="btnrow"><button class="btn ghost sm" data-act="toggle" data-key="editDebts">${ui.editDebts ? 'Done' : 'Edit debts'}</button>${ui.editDebts ? '<button class="btn sm" data-act="addDebt">Add debt</button>' : ''}</div>
      <div class="note">Clear-by dates count from today. Without an APR they assume no interest — fine for 0% deals, optimistic for a mortgage.</div></div>`;
    return { title: 'Money', sub: fl.hasBal ? C.gbp(fl.safe, 0) + ' free · ' + fl.days + ' days to pay day' : (m.latest ? 'latest: ' + C.fmtM(m.latest.month) : ''), html: h };
  },

  lists() {
    const done = S.house.filter(j => j.status === 'Done').length, tot = S.house.length;
    let h = `<div class="card"><h2>House jobs</h2><div class="row"><div class="l"><b>${done} of ${tot} done</b></div><div class="num">${C.pct(tot ? done / tot : 0)}</div></div>${bar(tot ? done / tot : 0, 'amber')}
      <div style="margin-top:4px">${ui.editJobs ? S.house.map((j, i) => `<div class="erow"><div class="full">${field('Job', inp(`house.${i}.job`, j.job, 'text'))}</div>${field('Date done', inp(`house.${i}.dateDone`, j.dateDone, 'date'))}${field('Notes', inp(`house.${i}.notes`, j.notes, 'text'))}<div class="full"><button class="btn danger sm" data-act="delJob" data-i="${i}">Remove ${esc(j.job || 'job')}</button></div></div>`).join('') || '<div class="empty">No jobs yet.</div>'
        : S.house.map((j, i) => `<div class="row"><div class="l"><b style="${j.status === 'Done' ? 'color:var(--muted);text-decoration:line-through' : ''}">${esc(j.job)}</b><small>${j.dateDone ? esc(C.fmtD(j.dateDone)) : ''}${j.notes ? (j.dateDone ? ' · ' : '') + esc(j.notes) : ''}</small></div><button class="status ${j.status.replace(' ', '')}" data-act="cycle" data-i="${i}">${esc(j.status)}</button></div>`).join('') || '<div class="empty">No jobs yet.</div>'}</div>
      <div class="btnrow"><button class="btn ghost sm" data-act="toggle" data-key="editJobs">${ui.editJobs ? 'Done' : 'Edit jobs'}</button>${ui.editJobs ? '<button class="btn sm" data-act="addJob">Add job</button>' : ''}</div>
      <div class="note">Tap a status to move it on: To do → In progress → Done (sets today's date).</div></div>`;
    const cols = C.collections(S); const c = cols.find(x => x.key === ui.set) || cols[0];
    h += `<div class="card"><h2>Collections</h2><div class="chips">${cols.filter(x => x.key !== 'PSM demos').map(x => `<button class="chip ${x.key === c.key || (c.key === 'PSM demos' && x.key === 'PSM') ? 'on' : ''}" data-act="set" data-set="${esc(x.key)}">${esc(x.label)}</button>`).join('')}</div>
      ${c.key.startsWith('PSM') ? cols.filter(x => x.key.startsWith('PSM')).map(x => `<div class="prow"><span><b>${esc(x.label)}</b></span><span class="num muted small">${x.have} / ${x.total} · ${C.pct(x.pct)}</span>${bar(x.pct)}</div>`).join('') : `<div class="prow"><span><b>${esc(c.label)}</b></span><span class="num muted small">${c.have} / ${c.total} · ${C.pct(c.pct)}</span>${bar(c.pct)}</div>`}
      <div class="field" style="margin:12px 0 4px"><input type="search" id="search" placeholder="Search…" aria-label="Search this collection" value="${esc(ui.search)}"></div>
      <div id="ticklist">${tickList()}</div></div>`;
    return { title: 'Lists', sub: 'house jobs · collections', html: h };
  },

  games() {

/* ---------- chart ---------- */
function cssVar(n, fallback) {
  const v = getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  return v || fallback;
}
function drawChart() {
  const cv = $('#chart'); if (!cv) return;
  const data = C.moneyCalc(S.money).last12; if (!data.length) return;
  const dpr = window.devicePixelRatio || 1, H = 210, padL = 44, padB = 26, padT = 10;
  const avail = (cv.parentElement && cv.parentElement.clientWidth) || 320;
  const W = Math.max(avail, padL + 6 + 46 * data.length);        // give every month room; the wrapper scrolls
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  cv.width = W * dpr; cv.height = H * dpr;
  const x = cv.getContext && cv.getContext('2d'); if (!x) return;
  x.scale(dpr, dpr);
  const ink = cssVar('--muted', '#667085'), line = cssVar('--line', '#E4E9F0');
  const c1 = cssVar('--brand', '#1F3A5F'), c2 = cssVar('--teal', '#2A9D8F');
  const max = Math.max(...data.map(d => C.num(d.earnings)), 1), gw = (W - padL - 6) / data.length;
  x.font = '10px ' + getComputedStyle(document.body).fontFamily; x.fillStyle = ink; x.strokeStyle = line;
  const steps = 4;
  for (let i = 0; i <= steps; i++) {
    const v = max / steps * i, y = padT + (H - padT - padB) * (1 - v / max);
    x.beginPath(); x.moveTo(padL, y); x.lineTo(W, y); x.stroke();
    x.textAlign = 'right'; x.fillText('£' + Math.round(v / 1000) + 'k', padL - 6, y + 3);
  }
  data.forEach((d, i) => {
    const x0 = padL + i * gw + gw * 0.15, bw = gw * 0.32;
    const he = (H - padT - padB) * C.num(d.earnings) / max, hd = (H - padT - padB) * Math.max(C.num(d.disposable), 0) / max;
    x.fillStyle = c1; x.fillRect(x0, H - padB - he, bw, he);
    x.fillStyle = c2; x.fillRect(x0 + bw + 2, H - padB - hd, bw, hd);
    x.fillStyle = ink; x.textAlign = 'center'; x.fillText(C.fmtMs(d.month), x0 + bw, H - 8);
  });
}

function render(keepScroll = true) {
  const y = window.scrollY;

  try { v = VIEWS[tab](); } catch (err) {
    console.error(err);
    v = { title: 'Something broke', sub: '', html: `<div class="card"><h2>That view wouldn't draw</h2>
      <div class="muted">Usually a backup with something missing in it. Your data is untouched — download it, then reset and restore.</div>
      <pre class="mono small" style="white-space:pre-wrap;color:var(--bad);margin:12px 0 0">${esc(String(err && err.message || err))}</pre>
      <div class="btnrow"><button class="btn" data-act="export">Download backup</button><button class="btn ghost" data-act="tab" data-tab="home">Back to Home</button>
      <button class="btn danger" data-act="reset">Reset everything</button></div></div>` };
  }
  $('#title').textContent = v.title; $('#sub').textContent = v.sub || ''; $('#view').innerHTML = v.html;
  document.querySelectorAll('.tabs button').forEach(b => {
    const on = b.dataset.tab === tab;
    b.classList.toggle('on', on); b.setAttribute('aria-selected', on ? 'true' : 'false');

function parseInput(el) {
  if (el.type === 'checkbox') return el.checked;
  if (el.type === 'number') { if (el.value === '') return null; const v = parseFloat(el.value); if (isNaN(v)) return null; return el.dataset.kind === 'pct' ? v / 100 : v; }
  return el.value === '' ? null : el.value;
}

  if (a === 'delFixed') { S.pay.fixed.splice(+d.i, 1); commit(); return; }
  if (a === 'addGame') { const n = $('#g_name').value.trim(); if (!n) { toast('Type the game first'); $('#g_name').focus(); return; }
    S.games.push({ id: uid(), game: n, date: $('#g_date').value || null, notes: $('#g_notes').value.trim() }); commit(); toast('Added to log'); return; }
  if (a === 'delGame') { const g = S.games.find(x => x.id === d.id);
    if (await confirmDlg('Remove from the log?', esc(g ? g.game : ''))) { S.games = S.games.filter(x => x.id !== d.id); commit(); } return; }
  if (a === 'setPin') { setPin(); return; }
  if (a === 'changePin') { changePin(); return; }
  if (a === 'clearPin') { clearPin(); return; }
  if (a === 'forgotPin') {
    const yes = await dialog({ title: 'There is no way back in',
      body: 'The figures on this device are encrypted with your PIN and cannot be recovered without it. You can clear this device and restore a backup instead — everything in the backup comes back.',
      ok: 'Clear and start again', danger: true });
    if (!yes) return;
    try { localStorage.removeItem(KEY); } catch (e) { }
    location.reload();
    return;
  }
  if (a === 'import') { $('#importFile').click(); return; }
  if (a === 'export') { exportBackup(); return; }
  if (a === 'copy') { (navigator.clipboard ? navigator.clipboard.writeText(JSON.stringify(S)) : Promise.reject()).then(() => toast('Backup copied — paste it somewhere safe'), () => toast('Copy not available here')); return; }
  if (a === 'reset') { if (await confirmDlg(SEED.generic ? 'Clear everything on this device?' : 'Reset to the spreadsheet data?',
      SEED.generic ? 'Restore a backup to get it back.' : 'Your changes on this device will be lost.', 'Yes, clear it')) {
      S = clone(SEED); normalize(); commit(); toast(SEED.generic ? 'Cleared' : 'Reset to spreadsheet data'); } return; }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'importFile') { if (el.files[0]) importBackup(el.files[0]); el.value = ''; return; }
  if (el.dataset.hours) { const h = S.pay.hours[el.dataset.payday] = S.pay.hours[el.dataset.payday] || {}; h[el.dataset.hours] = Math.max(0, C.num(el.value)); if (!h.ot && !h.sun) delete S.pay.hours[el.dataset.payday]; commit(); return; }
  const amt = el.dataset.set && el.dataset.set.match(/^money\.bills\.(\d+)\.amount$/);
  if (amt) { billAmountChanged(+amt[1], parseInput(el)); return; }
  if (el.dataset.set) {
    setPath(S, el.dataset.set, parseInput(el));
    if (el.dataset.set === 'money.balance') S.money.balanceOn = C.today();   // stamp it so a stale figure is obvious
    commit();
  }
});
document.addEventListener('input', e => { if (e.target.id === 'search') { ui.search = e.target.value; const l = $('#ticklist'); if (l) l.innerHTML = tickList(); } });
document.addEventListener('toggle', e => { if (e.target.dataset && e.target.dataset.key) ui.open[e.target.dataset.key] = e.target.open; }, true);
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'g_name') { e.preventDefault(); $('#g_notes').focus(); } });
addEventListener('scroll', () => { $('#hdr').classList.toggle('stuck', window.scrollY > 4); }, { passive: true });
let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(drawChart, 150); });
/* Left open overnight, or resumed from the background, the figures would still
   be yesterday's. Redraw whenever the day actually turns over. */
let lastDay = null;
function dayWatch() { if (!S) return; const d = C.today(); if (d !== lastDay) { lastDay = d; render(); } }
const AUTOLOCK_MS = 5 * 60 * 1000;
let hiddenAt = 0;
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { hiddenAt = Date.now(); return; }
  // away long enough with a PIN set: reload so the lock screen comes back
  if (pinIsSet() && hiddenAt && Date.now() - hiddenAt > AUTOLOCK_MS) { location.reload(); return; }
  dayWatch();
});
addEventListener('focus', dayWatch);
setInterval(dayWatch, 60000);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (theme === 'auto') { applyTheme(); drawChart(); } });

/* A bill's price changing is worth recording, not overwriting — that is the
   only way the app can ever tell you what a bill has done over time. Offer the
   split rather than doing it silently, since sometimes you are just fixing a typo. */
async function billAmountChanged(i, next) {
  const b = S.money.bills[i];
  if (!b) return;
  const prev = C.num(b.amount), thisMonth = C.mkey(C.today());
  const worthKeeping = prev && next !== null && C.r2(next) !== C.r2(prev)
    && b.started && b.started < thisMonth && !b.ended && !b.link;
  if (!worthKeeping) { b.amount = next; commit(); return; }
  const up = next > prev, diff = Math.abs(C.r2(next - prev));
  const keep = await dialog({
    title: `${b.name || 'That bill'} ${up ? 'has gone up' : 'has come down'}`,
    body: `${C.gbp(prev)} → ${C.gbp(next)} a month — ${up ? 'up' : 'down'} ${C.gbp(diff)}, or ${C.gbp(diff * 12, 0)} a year.`,
    ok: 'Keep the old price', cancel: 'Just change it'
  });
  // another change event may have handled this bill while the prompt was open
  if (S.money.bills[i] !== b || C.r2(C.num(b.amount)) !== C.r2(prev) || b.ended) return;
  if (keep) {
    b.ended = C.mkey(C.addMonths(thisMonth + '-01', -1));
    S.money.bills.splice(i + 1, 0, { ...b, id: uid(), amount: next, started: thisMonth, ended: null });
    toast(`Old price kept until ${C.fmtM(b.ended)}`);
  } else {
    b.amount = next;
  }
  commit();
}

/* ---------- backup ---------- */
function exportBackup() {
  const blob = new Blob([JSON.stringify(S, null, 1)], { type: 'application/json' }); const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = `decs-tracker-${C.today()}.json`; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 800); toast('Backup downloaded');
}
function importBackup(file) {
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const o = JSON.parse(rd.result);
      if (!o || typeof o !== 'object' || !o.pay || !o.money) throw new Error('not a backup');
      S = o; normalize(); commit(); toast('Backup restored');
    } catch (e) { toast("That file isn't a backup from this app"); }
  };
  rd.onerror = () => toast("Couldn't read that file");
  rd.readAsText(file);
}

/* ---------- boot ---------- */
(async function boot() {
  try { const t = localStorage.getItem(THEME_KEY); if (t === 'light' || t === 'dark' || t === 'auto') theme = t; } catch (e) { }
  applyTheme();
  buildTabs();
  storageOK = probeStorage();
  let raw = null;
  if (storageOK) { try { raw = localStorage.getItem(KEY); } catch (e) { } }
  const blob = encBlob(raw);
  if (blob) {
    if (!CRYPTO_OK) {                                  // encrypted, but this browser cannot decrypt
      document.body.classList.add('locked');
      $('#lock').hidden = false;
      $('#lockHint').textContent = 'This browser cannot decrypt the saved data. Open the app over https, or restore a backup.';
      $('#pinIn').hidden = true; $('#lockGo').hidden = true;
      return;
    }
    await unlockScreen(blob);                          // resolves once the PIN opens it
  } else {
    S = load();
  }
  normalize();
  save();
  if (PAY_ONLY) { tab = 'pay'; $('#tabs').style.display = 'none'; document.body.classList.add('notabs'); }
  lastDay = C.today();
  render(false);
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('./sw.js').catch(() => { });
})();
</script>
