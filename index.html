<title>Dec's Tracker</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231F3A5F'/%3E%3Ctext x='32' y='43' font-family='Arial' font-weight='800' font-size='30' fill='%232A9D8F' text-anchor='middle'%3ED%3C/text%3E%3C/svg%3E">
<style>
/* ===================================================================
   Design tokens. Every colour is a variable so the dark theme is a
   token swap, not a second stylesheet.
   =================================================================== */
:root{
  --brand:#1F3A5F; --on-brand:#FFFFFF;
  --teal:#2A9D8F; --amber:#E9C46A; --coral:#E76F51; --forest:#3A8F5C;
  --bg:#F4F7FB;
  --card:#FFFFFF; --card-2:#F3F6FA; --card-brd:transparent;
  --ink:#101828; --ink-2:#344054; --muted:#5B6477; --line:#E4E9F0; --line-2:#D3DBE6;
  --good:#17703F; --good-bg:#E3F4EA; --warn:#735A14; --warn-bg:#FDF1D6; --bad:#B42318; --bad-bg:#FDE7E4;
  --fld:#FFFFFF; --fld-brd:#8B95A7; --chip:#E6ECF4; --chip-ink:#1F3A5F;
  --sh-1:0 1px 2px rgba(16,24,40,.05); --sh-2:0 1px 2px rgba(16,24,40,.05),0 10px 24px -18px rgba(16,24,40,.35);
  --sh-3:0 10px 34px -12px rgba(16,24,40,.28);
  --r-xs:8px; --r-sm:10px; --r:14px; --r-lg:18px; --r-full:999px;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Roboto Mono",monospace;
  --tap:44px;
}
:root[data-theme="dark"]{
  --brand:#5B8FC7; --on-brand:#0B1220;
  --teal:#3FBFAE; --amber:#EBC46B; --coral:#F08163; --forest:#4FB075;
  --bg:#0C1119;
  --card:#151D29; --card-2:#1B2634; --card-brd:#222E3F;
  --ink:#E9EEF6; --ink-2:#C2CCDA; --muted:#8B98AC; --line:#232F41; --line-2:#2E3D52;
  --good:#5CCB8E; --good-bg:#16301F; --warn:#E3BE6B; --warn-bg:#332A12; --bad:#F98A7B; --bad-bg:#3A1B18;
  --fld:#111927; --fld-brd:#56677F; --chip:#1D2836; --chip-ink:#C2CCDA;
  --sh-1:none; --sh-2:none; --sh-3:0 12px 30px -14px rgba(0,0,0,.7);
}
/* A theme picked in Settings has to reach the browser's own parts too — the
   calendar icon in a date field, a dialog's text — or they stay in the
   phone's scheme and vanish against the other one. */
:root[data-theme="dark"]{color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --brand:#5B8FC7; --on-brand:#0B1220;
    --teal:#3FBFAE; --amber:#EBC46B; --coral:#F08163; --forest:#4FB075;
    --bg:#0C1119;
    --card:#151D29; --card-2:#1B2634; --card-brd:#222E3F;
    --ink:#E9EEF6; --ink-2:#C2CCDA; --muted:#8B98AC; --line:#232F41; --line-2:#2E3D52;
    --good:#5CCB8E; --good-bg:#16301F; --warn:#E3BE6B; --warn-bg:#332A12; --bad:#F98A7B; --bad-bg:#3A1B18;
    --fld:#111927; --fld-brd:#56677F; --chip:#1D2836; --chip-ink:#C2CCDA;
    --sh-1:none; --sh-2:none; --sh-3:0 12px 30px -14px rgba(0,0,0,.7);
  }
}

/* ===================================================================
   Base
   =================================================================== */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg);scroll-padding:84px 0 90px}
body{margin:0;font:16px/1.45 var(--sans);color:var(--ink);background:var(--bg);
  padding-bottom:calc(78px + env(safe-area-inset-bottom));-webkit-tap-highlight-color:transparent}
body.notabs{padding-bottom:24px}
:where(a){color:var(--brand)}
::selection{background:color-mix(in srgb,var(--teal) 30%,transparent)}

/* Focus: one consistent ring everywhere, never removed. */
:where(button,input,select,textarea,summary,[tabindex]):focus-visible{
  outline:2px solid var(--teal);outline-offset:2px;border-radius:var(--r-xs)}

/* ===================================================================
   Header — sticky, condenses on scroll
   =================================================================== */
header{position:sticky;top:0;z-index:6;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
  display:flex;align-items:center;gap:12px;
  background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px) saturate(1.4);
  -webkit-backdrop-filter:blur(14px) saturate(1.4);border-bottom:1px solid transparent;transition:border-color .2s}
header.stuck{border-bottom-color:var(--line)}
.hgrp{min-width:0;flex:1}
h1{margin:0;font-size:23px;font-weight:800;letter-spacing:-.025em;color:var(--ink);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* held open when empty, so the page does not jump 14px between tabs with and without one */
.sub{color:var(--muted);font-size:12.5px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:18px}
.iconbtn{width:44px;height:44px;flex:0 0 44px;border:1px solid var(--line);border-radius:var(--r-full);
  background:var(--card);color:var(--ink-2);display:grid;place-items:center;padding:0;cursor:pointer}
.iconbtn:active{transform:scale(.94)}
.iconbtn.on{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.iconbtn svg{width:19px;height:19px}
/* .iconbtn sets display, which would beat the UA's [hidden]{display:none} */
.iconbtn[hidden]{display:none}

main{padding:2px 12px 20px;max-width:760px;margin:0 auto}
@media (min-width:700px){header{max-width:760px;margin:0 auto}}

/* ===================================================================
   Cards & type
   =================================================================== */
.card{background:var(--card);border:1px solid var(--card-brd);border-radius:var(--r-lg);
  padding:16px;margin:12px 0;box-shadow:var(--sh-2)}
.card h2{margin:0 0 4px;font-size:16.5px;font-weight:800;color:var(--ink);letter-spacing:-.015em;
  display:flex;align-items:center;gap:8px;justify-content:space-between;text-wrap:balance}
.card h2 .hint{flex:0 0 auto;font-weight:600;font-size:12px;color:var(--muted);letter-spacing:0;text-align:right}
.eyebrow{font-size:10.5px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.muted{color:var(--muted);font-size:13.5px}
.dim{color:var(--muted)}
.small{font-size:12px}
.note{color:var(--muted);font-size:12.5px;line-height:1.5;margin-top:10px}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.mono{font-family:var(--mono);font-size:13px}
.neg{color:var(--bad)}.pos{color:var(--good)}
.strong{font-weight:800;font-size:18px}
.sep{height:1px;background:var(--line);margin:14px 0}

/* ===================================================================
   Tiles
   =================================================================== */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.tile{position:relative;border-radius:var(--r-lg);padding:13px 14px 12px;color:#fff;min-height:98px;
  display:flex;flex-direction:column;justify-content:flex-start;overflow:hidden;isolation:isolate}
.tile::after{content:"";position:absolute;inset:0;z-index:-1;
  background:linear-gradient(150deg,rgba(255,255,255,.16),rgba(255,255,255,0) 62%)}
/* two lines kept for the caption whether it needs them or not, so the figures in a row line up */
.tile .cap{font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;line-height:1.25;min-height:2.5em;text-wrap:balance}
.tile .val{font-size:25px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;
  line-height:1.1;margin:7px 0 3px;overflow-wrap:anywhere}
.tile .tsub{font-size:12px;line-height:1.35;text-wrap:balance}
.navy{background:var(--brand);color:var(--on-brand)}
.teal{background:var(--teal);color:#06231F}
.amber{background:var(--amber);color:#3A2E0B}
.coral{background:var(--coral);color:#3A1408}
.forest{background:var(--forest);color:#021A0B}

/* ===================================================================
   Rows / lists
   =================================================================== */
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .l{min-width:0;flex:1}
.row .l b{display:block;overflow-wrap:anywhere;font-weight:700}
.row .l small,.meta{display:block;color:var(--muted);font-size:12px;line-height:1.4;margin-top:1px}
/* when small print does wrap, never leave one word stranded on the last line */
.row .l small,.meta,.note,.muted,.banner,.attnrow span{text-wrap:pretty}
.field label,details summary,.board .brow .h{text-wrap:balance}
.empty{color:var(--muted);font-size:13.5px;padding:20px 0;text-align:center}

/* ===================================================================
   Forms
   =================================================================== */
input,select,textarea,button{font:inherit;color:var(--ink)}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:11.5px;color:var(--muted);font-weight:700;letter-spacing:.01em}
.field input,.field select,.field textarea{border:1px solid var(--fld-brd);border-radius:var(--r-sm);
  padding:11px 12px;background:var(--fld);width:100%;min-width:0;min-height:var(--tap)}
/* a select or a date picker comes out a couple of pixels taller than a text box; pin them all to one height */
.field input:not([type=checkbox]),.field select{height:46px;padding-top:0;padding-bottom:0}
/* "January 2027" and the calendar icon need the room at phone width */
.field input[type=month],.field input[type=date]{padding-left:9px;padding-right:7px}
.field textarea{min-height:0}
.field input:disabled{background:var(--card-2);color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:end}
.full{grid-column:1/-1}
.check{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:14px;cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--teal);flex:0 0 22px}
/* A number that may be negative: the ± button flips the sign, for keypads with no minus key */
.signed{display:flex;gap:6px;align-items:stretch}
.signed input{flex:1;min-width:0}
.signed .sgn{flex:0 0 48px;border:1px solid var(--fld-brd);background:var(--card-2);border-radius:var(--r-sm);
  font-size:19px;font-weight:800;color:var(--ink-2);cursor:pointer;min-height:var(--tap);padding:0;line-height:1}
.signed .sgn.on{background:var(--bad-bg);border-color:var(--bad-bg);color:var(--bad)}
.signed .sgn:active{transform:scale(.95)}

/* Switch — used for the optional bill-shift settings */
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
.switch:last-child{border-bottom:0}
.switch .sl{min-width:0}
.switch .sl b{display:block;font-size:14px;font-weight:700}
.switch .sl small{display:block;color:var(--muted);font-size:12px;line-height:1.4;margin-top:1px}
.switch input{position:absolute;opacity:0;width:0;height:0}
.switch .track{flex:0 0 46px;width:46px;height:28px;border-radius:var(--r-full);background:var(--fld-brd);
  position:relative;transition:background .18s}
.switch .track::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;
  background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .18s}
.switch input:checked+.track{background:var(--teal)}
.switch input:checked+.track::after{transform:translateX(18px)}
.switch input:focus-visible+.track{outline:2px solid var(--teal);outline-offset:2px}

/* Segmented control — the "optional button" for weekend/bank-holiday shifting */
.seg{display:flex;background:var(--card-2);border-radius:var(--r-sm);padding:3px;gap:3px;
  border:1px solid var(--line)}
.seg button{flex:1;border:0;background:none;color:var(--muted);font-size:12.5px;font-weight:700;line-height:1.2;
  padding:8px 6px;border-radius:calc(var(--r-sm) - 2px);cursor:pointer;min-height:40px;min-width:0;
  transition:background .15s,color .15s}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--on-brand)}
.subnav{margin:12px 0 0}
/* Home's "needs a look" rows: each one is a link into the section that deals with it */
.attnrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);
  background:none;color:var(--ink);font:inherit;font-size:13.5px;line-height:1.45;padding:11px 0;cursor:pointer}
.attnrow:last-child{border-bottom:0}
.attnrow span{flex:1}
.attnrow i{font-style:normal;color:var(--muted);font-size:22px;line-height:1}
.attnrow.bad{color:var(--bad)}
.attnmore{border:0;background:none;color:var(--brand);font:inherit;font-size:13px;font-weight:700;padding:10px 0 0;
  cursor:pointer;min-height:var(--tap)}

/* Stepper */
.hours{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0 14px}
.step{display:flex;align-items:stretch;border:1px solid var(--fld-brd);border-radius:var(--r-sm);
  overflow:hidden;background:var(--fld)}
.step button{flex:0 0 46px;border:0;background:var(--card-2);font-size:22px;color:var(--brand);font-weight:700;cursor:pointer}
.step button:active{background:var(--line)}
.step input{flex:1;border:0;text-align:center;font-size:21px;font-weight:800;font-variant-numeric:tabular-nums;
  width:100%;min-width:0;padding:11px 0;background:var(--fld);-moz-appearance:textfield}
.step input::-webkit-inner-spin-button,.step input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
/* an amount typed into a dialog: a keypad, and no spinner arrows to fat-finger */
.amtin{-moz-appearance:textfield;font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.amtin::-webkit-inner-spin-button,.amtin::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}

/* Buttons */
.btn{border:0;background:var(--brand);color:var(--on-brand);font-weight:700;padding:11px 16px;
  border-radius:var(--r-sm);font-size:14px;cursor:pointer;min-height:var(--tap);display:inline-flex;
  align-items:center;justify-content:center;gap:7px}
.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--chip);color:var(--chip-ink)}
.btn.teal{background:var(--teal);color:#06231F}
.btn.danger{background:var(--bad-bg);color:var(--bad)}
.btn.sm{padding:8px 12px;font-size:13px;min-height:40px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.del{border:0;background:none;color:var(--muted);font-size:22px;line-height:1;padding:6px 10px;cursor:pointer;
  min-height:var(--tap);min-width:var(--tap)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 12px}
.chip{border:0;padding:9px 13px;border-radius:var(--r-full);background:var(--chip);color:var(--chip-ink);
  font-size:13px;font-weight:700;cursor:pointer;min-height:40px}
.chip.on{background:var(--brand);color:var(--on-brand)}
/* one width for every status, so the job names line up whichever one a row is on */
.status{border:0;padding:7px 12px;border-radius:var(--r-full);font-size:12px;font-weight:800;min-width:102px;
  background:var(--chip);color:var(--chip-ink);white-space:nowrap;cursor:pointer;min-height:40px}
.status.Done{background:var(--good-bg);color:var(--good)}
.status.Inprogress{background:var(--warn-bg);color:var(--warn)}

/* ===================================================================
   Pay
   =================================================================== */
.payhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.payhead .big{font-size:24px;font-weight:800;color:var(--ink);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.results{margin-top:6px}
.results .r{display:flex;justify-content:space-between;gap:12px;padding:7px 0;
  border-bottom:1px dashed var(--line);font-size:14px}
.results .r span:first-child{color:var(--ink-2)}
.results .r.total{border:0;border-top:2px solid var(--brand);margin-top:5px;padding-top:11px;font-size:18px;font-weight:800}
.results .r.extra{background:var(--good-bg);color:var(--good);margin:8px -16px -16px;padding:12px 16px;border:0;
  border-radius:0 0 var(--r-lg) var(--r-lg);font-weight:700}
/* a note under a figure sits on its own line and lines up with it, rather than
   running straight on the end of the number */
.results .r > span:last-child{text-align:right;flex:none}   /* the label wraps; a figure never breaks after its minus sign */
.results .r small{display:block;font-weight:600;font-size:12px;margin-top:2px;color:var(--muted)}
.results .r.extra small{color:inherit}
.tag{display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:.1em;padding:3px 7px;
  border-radius:var(--r-xs);background:var(--teal);color:#06231F;vertical-align:middle;margin-left:7px}

.board .brow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:11px 0;
  border-bottom:1px solid var(--line);cursor:pointer;text-align:left;width:100%;border-left:0;border-right:0;
  border-top:0;background:none;color:inherit;font:inherit}
.board .brow .bl,.board .brow .d,.board .brow .pr,.board .brow .h,.board .brow .n,.board .brow .muted{display:block}
.board .brow .d{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--ink);white-space:nowrap}
.board .brow .pr{font-family:var(--mono);font-size:11.5px;color:var(--muted);white-space:nowrap;margin-top:2px}
.board .brow .h{font-size:12.5px;color:var(--ink-2)}
.board .brow .n{font-variant-numeric:tabular-nums;font-weight:700;text-align:right;white-space:nowrap}
.board .brow.past .d,.board .brow.past .n{color:var(--muted);font-weight:600}
/* The highlight bleeds past the card's padding. The width has to grow with the
   negative margins, or the row just slides left and its columns stop lining up
   with the rows above and below. */
.board .brow.sel{background:var(--card-2);margin:0 -16px;padding:11px 16px;width:calc(100% + 32px);border-radius:var(--r-sm)}
.board .brow.nextpd{background:var(--good-bg);margin:0 -16px;padding:11px 16px;width:calc(100% + 32px);border-radius:var(--r-sm)}
/* on its own line: inline, the chip widens the date column and squeezes the
   hours into two lines, so the one highlighted row reads unlike all the others */
.board .brow .tag{margin:5px 0 0}
.yearhdr{display:flex;width:100%;justify-content:space-between;align-items:center;gap:10px;border:0;
  background:none;padding:16px 0 9px;border-bottom:2px solid var(--line);font-weight:800;font-size:15px;
  color:var(--ink);text-align:left;cursor:pointer}
.yearhdr .ym{display:flex;align-items:center;gap:10px;font-weight:600;font-size:12px;color:var(--muted)}
.yearhdr i{font-style:normal;font-weight:800;font-size:17px;line-height:1;color:var(--chip-ink);width:26px;
  height:26px;border-radius:var(--r-xs);background:var(--chip);display:grid;place-items:center}
.yearhdr[aria-expanded="true"] i{background:var(--brand);color:var(--on-brand)}

/* ===================================================================
   Cash flow (new)
   =================================================================== */
.flowhero{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:2px 0 10px}
/* the long line under the figure wraps inside its own column instead of pushing "a day" onto a line of its own */
.flowhero>div:first-child{flex:1 1 0;min-width:0}
.flowhero .amt{font-size:34px;font-weight:800;letter-spacing:-.035em;font-variant-numeric:tabular-nums;line-height:1}
.flowhero .amt.neg{color:var(--bad)}
.flowhero .per{text-align:right;font-size:13px;color:var(--muted)}
.flowhero .per b{display:block;font-size:17px;color:var(--ink);font-variant-numeric:tabular-nums}
.sparkwrap{margin:12px 0 4px}
.spark{display:block;width:100%;height:66px;overflow:hidden}
.ledger{margin-top:6px}
.lrow{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;padding:9px 0;
  border-bottom:1px solid var(--line)}
.lrow:last-child{border-bottom:0}
.lrow .ld{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--ink-2);text-align:center;
  background:var(--card-2);border-radius:var(--r-xs);padding:5px 2px;line-height:1.15}
.lrow .ld span{display:block;font-size:9.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.lrow.pay .ld{background:var(--good-bg);color:var(--good)}
.lrow.pay .ld span{color:var(--good)}
.lrow .ln{min-width:0}
.lrow .ln b{display:block;font-size:14px;font-weight:700;overflow-wrap:anywhere}
.lrow .ln small{display:block;color:var(--muted);font-size:11.5px;margin-top:1px}
.lrow .lv{text-align:right;font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.lrow .lv small{display:block;font-weight:600;color:var(--muted);font-size:11.5px}
.lrow .lv small.neg{color:var(--bad)}
/* gone, so quieter — by colour rather than fading the whole row past readable */
.lrow.gone .ln b{color:var(--ink-2);font-weight:600}.lrow.gone .lv{color:var(--muted);font-weight:600}

.perrow:last-child,.perrow:not(:has(~ .perrow)){border-bottom:0}

/* ===================================================================
   Progress bars, ticks, tables
   =================================================================== */
.bar{height:8px;border-radius:var(--r-full);background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--forest);border-radius:var(--r-full);transition:width .3s}
.bar.teal i{background:var(--teal)}.bar.amber i{background:var(--amber)}.bar.coral i{background:var(--coral)}
.prow{display:grid;grid-template-columns:1fr auto;gap:6px 10px;padding:9px 0;border-bottom:1px solid var(--line);align-items:center}
.prow:last-child,.prow:not(:has(~ .prow)){border-bottom:0}
/* the bar and the buttons are grid items of .prow, so they are what has to span:
   a wrapped bar via .pb, a bare one (the category breakdown) directly */
.prow .pb,.prow .potact,.prow > .bar{grid-column:1/-1}
.potact{display:flex;gap:8px;margin-top:2px}
.tick{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.tick .box{width:28px;height:28px;border-radius:var(--r-xs);border:2px solid var(--fld-brd);flex:0 0 28px;
  display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;background:var(--fld);cursor:pointer;padding:0}
.tick.on .box{background:var(--good);border-color:var(--good);color:var(--card)}
.tick .name{flex:1;min-width:0;overflow-wrap:anywhere;cursor:pointer;font-size:14.5px;padding:6px 0}
.tick.on .name{color:var(--muted)}
.tick .g{font-size:11px;font-weight:800;color:var(--chip-ink);background:var(--chip);border:0;border-radius:var(--r-xs);
  padding:6px 9px;white-space:nowrap;cursor:pointer;min-height:40px}
.tick .g.has{background:var(--warn-bg);color:var(--warn)}
.psm{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.psm .t{font-size:12px;color:var(--muted);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.psm .box{width:46px;height:40px;border-radius:var(--r-xs);border:2px solid var(--fld-brd);display:grid;
  place-items:center;font-size:11px;font-weight:800;color:var(--muted);background:var(--fld);cursor:pointer}
.psm .box.on{background:var(--good);border-color:var(--good);color:var(--card)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card-2);border-radius:var(--r);padding:12px 8px;text-align:center}
.stat b{display:block;font-size:23px;font-weight:800;color:var(--ink);letter-spacing:-.025em;font-variant-numeric:tabular-nums}
.stat span{display:block;line-height:1.3;font-size:10.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.table{width:100%;border-collapse:collapse;font-size:13px}
.table th{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:right;

.table td{padding:9px 5px;text-align:right;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}

  border-radius:var(--r-full);cursor:pointer;pointer-events:none;min-height:36px}

<script>
/* ===== calc: pure functions, no DOM ===== */
const C = (() => {
  const r2 = x => Math.round((x + Number.EPSILON) * 100) / 100;
  const num = v => (v === null || v === undefined || v === '' || isNaN(+v)) ? 0 : +v;
  const i2d = s => new Date(s + 'T00:00:00Z');
  const d2i = d => d.toISOString().slice(0, 10);
  const dim = (y, m) => new Date(Date.UTC(y, m + 1, 0)).getUTCDate();
  const addDays = (s, n) => d2i(new Date(i2d(s).getTime() + n * 86400000));
  const addMonths = (s, n) => {
    const d = i2d(s); const m = d.getUTCMonth() + n;
    const y = d.getUTCFullYear() + Math.floor(m / 12); const mm = ((m % 12) + 12) % 12;
    return d2i(new Date(Date.UTC(y, mm, Math.min(d.getUTCDate(), dim(y, mm)))));
  };
  const daysBetween = (a, b) => Math.round((i2d(b) - i2d(a)) / 86400000);
  const today = () => { const d = new Date(); return d2i(new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()))); };
  const mkey = s => s.slice(0, 7);
  const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const dow = s => i2d(s).getUTCDay();
  /* The spaces inside a date are non-breaking, so "12 Mar 2027" wraps as a
     whole rather than leaving "12" at the end of one line and "Mar 2027" on the
     next. A regex \s still matches them. */
  const NB = '\u00a0';
  const fmtD = s => { if (!s) return ''; const d = i2d(s); return `${d.getUTCDate()}${NB}${MON[d.getUTCMonth()]}${NB}${d.getUTCFullYear()}`; };
  const fmtDM = s => { const d = i2d(s); return `${String(d.getUTCDate()).padStart(2, '0')}${NB}${MON[d.getUTCMonth()]}`; };
  const fmtDow = s => `${DOW[dow(s)]}${NB}${fmtDM(s)}`;
  const fmtM = k => `${MON[+k.slice(5, 7) - 1]}${NB}${k.slice(0, 4)}`;
  const fmtMs = k => `${MON[+k.slice(5, 7) - 1]}${NB}${k.slice(2, 4)}`;
  const ord = n => n + (n % 100 >= 11 && n % 100 <= 13 ? 'th' : ['th', 'st', 'nd', 'rd'][n % 10] || 'th');
  // made once and kept: toLocaleString with options builds a new formatter for every figure on the page
  const nfs = {};
  const nf = dp => nfs[dp] || (nfs[dp] = new Intl.NumberFormat('en-GB', { minimumFractionDigits: dp, maximumFractionDigits: dp }));
  const gbp = (v, dp = 2) => {
    if (v === null || v === undefined || v === '' || isNaN(v)) return '–';
    return (v < 0 ? '-£' : '£') + nf(dp).format(Math.abs(v));
  };
  const pct = v => (v === null || v === undefined || isNaN(v)) ? '–' : Math.round(v * 100) + '%';
  /* An interest rate is not a savings percentage: 4.1% rounded to 4% is a
     different mortgage. Trailing zeros still go, so 5% stays 5%. */
  const rate = v => (v === null || v === undefined || isNaN(v)) ? '–' : +(v * 100).toFixed(2) + '%';

  /* ---------- working days & UK bank holidays ----------
     Direct debits and standing orders only move on working days. A bill dated a
     Sunday is normally taken the next working day, so the calendar date on the
     bank statement drifts. All of this is computed offline: no network, no list
     to keep up to date. England & Wales dates. */
  const easter = y => {                                   // Meeus/Jones/Butcher
    const a = y % 19, b = Math.floor(y / 100), c = y % 100;
    const d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25);
    const g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30;
    const i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7;
    const m = Math.floor((a + 11 * h + 22 * l) / 451);
    const mo = Math.floor((h + l - 7 * m + 114) / 31), day = ((h + l - 7 * m + 114) % 31) + 1;
    return d2i(new Date(Date.UTC(y, mo - 1, day)));
  };
  const bhCache = {};
  function bankHolidays(y) {
    if (bhCache[y]) return bhCache[y];
    const out = new Set();
    const nextFree = s => { while (dow(s) === 0 || dow(s) === 6 || out.has(s)) s = addDays(s, 1); return s; };
    const onOrAfter = (s, w) => { while (dow(s) !== w) s = addDays(s, 1); return s; };
    const onOrBefore = (s, w) => { while (dow(s) !== w) s = addDays(s, -1); return s; };
    const es = easter(y);

    out.add(addDays(es, -2));                             // Good Friday
    out.add(addDays(es, 1));                              // Easter Monday
    out.add(onOrAfter(`${y}-05-01`, 1));                  // Early May
    out.add(onOrBefore(`${y}-05-31`, 1));                 // Spring
    out.add(onOrBefore(`${y}-08-31`, 1));                 // Summer
    out.add(nextFree(`${y}-12-25`));                      // Christmas (+ substitute)
    out.add(nextFree(`${y}-12-26`));                      // Boxing Day (+ substitute)
    bhCache[y] = out;
    return out;
  }
  const isBankHol = s => bankHolidays(+s.slice(0, 4)).has(s);
  const isWorkingDay = (s, bh) => { const w = dow(s); return w !== 0 && w !== 6 && !(bh && isBankHol(s)); };
  const whyNot = (s, bh) => (bh && isBankHol(s)) ? 'bank holiday' : dow(s) === 0 ? 'Sunday' : dow(s) === 6 ? 'Saturday' : '';

    if (shift !== 'next' && shift !== 'prev') return { date: s, nominal: s, moved: false, why: '' };
    const why = whyNot(s, bh);
    if (!why) return { date: s, nominal: s, moved: false, why: '' };
    const step = shift === 'prev' ? -1 : 1;

        if (cryptoIters !== PBKDF2_ITERS) {
          const salt = crypto.getRandomValues(new Uint8Array(16)), key = await deriveKey(pin, salt, PBKDF2_ITERS);
          cryptoKey = key; cryptoSalt = salt; cryptoIters = PBKDF2_ITERS;
        }
        S = data;
        wrap.hidden = true; document.body.classList.remove('locked');
        form.onsubmit = null;
        resolve();
      } catch (e2) {
        attempts++;
        err.textContent = attempts > 2 ? `That PIN didn\u2019t work (${attempts} tries)` : 'That PIN didn\u2019t work';
        input.value = ''; input.focus();
        // slow repeated guesses down a little; PBKDF2 already makes each one cost
        await new Promise(r => setTimeout(r, Math.min(attempts * 400, 3000)));
      } finally { busy = false; go.disabled = false; go.textContent = 'Unlock'; }
    };
  });
}

/* ---------------- turning the PIN on, changing it, turning it off ---------------- */
async function askPin(title, body, ok, danger) {
  const v = await dialog({ title, body, ok: ok || 'Continue', input: '', inputType: 'password', danger: !!danger });
  return v === null ? null : String(v).trim();
}
/* A phone picked up while it is unlocked should not be able to take the lock
   off, or change it to a PIN its owner does not know — so both ask for the PIN
   in use first. The key is the check: a byte sealed with the key in hand has
   to open with the one the typed PIN makes. Nothing is stored to compare
   against, so there is still nothing on the device to guess from. */
async function pinMatches(pin) {
  if (!pin || !cryptoKey || !cryptoSalt) return false;
  toast('Checking…');
  try {
    const key = await deriveKey(pin, cryptoSalt, cryptoIters), iv = crypto.getRandomValues(new Uint8Array(12));
    const probe = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, cryptoKey, new Uint8Array([1]));
    await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, probe);
    return true;
  } catch (e) { return false; }
}
async function setPin() {
  if (!CRYPTO_OK) { toast('This browser cannot encrypt'); return; }
  const ready = await dialog({
    title: 'Before you set a PIN',
    body: 'The data on this device gets encrypted with it. <b>If you forget the PIN it cannot be recovered</b> — not by us, not by anyone. Download a backup first and keep it somewhere safe.',
    ok: 'Download a backup', cancel: 'Cancel'
  });
  if (!ready) return;
  exportBackup();
  const one = await askPin('Choose a PIN', 'Six digits or more. Longer is harder to guess.', 'Next');
  if (one === null) return;
  if (one.length < 6) { toast('Use at least 6 characters'); return; }
  const two = await askPin('Type it again', 'Just to be sure you have it right.', 'Turn on PIN lock');
  if (two === null) return;
  if (one !== two) { toast("Those didn't match — nothing changed"); return; }
  await rekey(one);
  render();
  toast('PIN lock on');
}
async function changePin() {
  const now = await askPin('Your current PIN', 'Type the PIN you use now before choosing a new one.', 'Next');
  if (now === null) return;
  if (!(await pinMatches(now))) { toast("That isn't your current PIN — nothing changed"); return; }
  const one = await askPin('New PIN', 'Six digits or more.', 'Next');
  if (one === null) return;
  if (one.length < 6) { toast('Use at least 6 characters'); return; }
  const two = await askPin('Type it again', '', 'Change PIN');
  if (two === null) return;
  if (one !== two) { toast("Those didn't match — nothing changed"); return; }
  await rekey(one);
  toast('PIN changed');
}
/* Derived first and swapped in together: a save landing while the key was
   being worked out used to seal with the new salt and the old key, which
   opens with neither PIN. */
async function rekey(pin) {
  const salt = crypto.getRandomValues(new Uint8Array(16)), key = await deriveKey(pin, salt, PBKDF2_ITERS);
  cryptoKey = key; cryptoSalt = salt; cryptoIters = PBKDF2_ITERS;
  await save();
}
async function clearPin() {
  const now = await askPin('Turn off the PIN lock?',
    'Your figures go back to being stored unencrypted on this device, readable by anyone who can unlock the phone. Type your PIN to turn it off.',
    'Turn it off', true);
  if (now === null) return;
  if (!(await pinMatches(now))) { toast("That isn't your PIN — the lock stays on"); return; }
  cryptoKey = null; cryptoSalt = null;
  plainOK = true;                                    // this one save is allowed to go back to plain
  await save();
  plainOK = false;
  render();
  toast('PIN lock off');
}

/* ---------- small html helpers ---------- */
const tile = (cls, cap, val, sub) => `<div class="tile ${cls}"><div class="cap">${esc(cap)}</div><div><div class="val">${val}</div><div class="tsub">${sub || ''}</div></div></div>`;
/* The label is tied to the first control in the field — its own id if it has
   one, a fresh one if not — so tapping the words focuses the box, and a screen
   reader names the box by them rather than by its placeholder. */
let fieldSeq = 0;
const field = (label, inner) => {
  let id = null;
  const tied = inner.replace(/<(input|select|textarea)\b[^>]*>/, tag => {
    const own = tag.match(/\bid="([^"]+)"/);
    if (own) { id = own[1]; return tag; }
    id = 'f' + (++fieldSeq);
    return tag.replace(/^<(\w+)/, `<$1 id="${id}"`);
  });
  return `<div class="field"><label${id ? ` for="${id}"` : ''}>${esc(label)}</label>${tied}</div>`;
};
const inp = (path, val, type = 'number', extra = '') => {
  const v = val === null || val === undefined ? '' : val;
  const attrs = type === 'number' ? 'type="number" inputmode="decimal" step="any"' : `type="${type}"`;
  return `<input ${attrs} data-set="${esc(path)}" value="${esc(v)}" ${extra}>`;
};
/* A figure that can legitimately be negative — an overdraft, a month you dipped
   into savings. inputmode="decimal" is deliberately left off: it means "fractional
   numeric", and phone keypads for it carry no minus key. The ± button covers any
   keyboard that still doesn't offer one. */
const signedInp = (path, val, extra = '') => {
  const neg = C.num(val) < 0, v = val === null || val === undefined ? '' : val;
  return `<div class="signed"><input type="number" step="any" data-set="${esc(path)}" value="${esc(v)}" ${extra}>
    <button type="button" class="sgn${neg ? ' on' : ''}" data-act="sign" aria-label="Make this ${neg ? 'positive' : 'negative'}">${neg ? '−' : '+'}</button></div>`;
};
const pctInp = (path, val) => `<input type="number" inputmode="decimal" step="any" data-set="${esc(path)}" data-kind="pct" value="${val == null ? '' : +(val * 100).toFixed(4)}">`;
const sel = (path, val, opts) => `<select data-set="${esc(path)}">${opts.map(o => `<option${o === val ? ' selected' : ''}>${esc(o)}</option>`).join('')}</select>`;
const bar = (p, cls = '') => `<div class="bar ${cls}"><i style="width:${Math.max(0, Math.min(100, Math.round((p || 0) * 100)))}%"></i></div>`;
const detailsBlock = (key, title, inner) => `<details data-key="${key}"${ui.open[key] ? ' open' : ''}><summary>${esc(title)}</summary>${inner}</details>`;
const segment = (act, val, opts) => `<div class="seg" role="group">${opts.map(o =>
  `<button data-act="${act}" data-v="${esc(o.v)}" aria-pressed="${o.v === val}">${esc(o.l)}</button>`).join('')}</div>`;
const toggle = (path, on, label, note) => `<label class="switch"><span class="sl"><b>${esc(label)}</b>${note ? `<small>${esc(note)}</small>` : ''}</span>
  <input type="checkbox" data-set="${esc(path)}"${on ? ' checked' : ''}><span class="track"></span></label>`;
const flowOpt = () => ({ shift: S.money.dueShift, bankHols: !!S.money.bankHols });
/* The pay schedule is the heaviest sum in the app, and Home, Pay and Money all
   want it on every redraw — ticking a card, opening a year — though it can only
   change when the pay settings or the date do. */
let payMemo = { key: '', val: null };
function payCalcNow() {
  const key = C.today() + JSON.stringify(S.pay);
  if (key !== payMemo.key) payMemo = { key, val: C.payCalc(S.pay) };
  return payMemo.val;
}
/* Twelve taps for the months a bill is not paid. Council tax over ten
   instalments, a gym frozen for the winter — the pattern varies, so all twelve

const selPairs = (path, val, opts) => `<select data-set="${esc(path)}">${opts.map(o =>
  `<option value="${esc(o.v)}"${String(o.v) === String(val ?? '') ? ' selected' : ''}>${esc(o.l)}</option>`).join('')}</select>`;
const monthPicker = (i, skip) => `<div class="months" role="group" aria-label="Months this bill is paid">${
  C.MON.map((name, k) => { const mo = k + 1, off = (skip || []).includes(mo);
    return `<button type="button" data-act="billSkip" data-i="${i}" data-m="${mo}" class="${off ? 'off' : ''}" aria-pressed="${off ? 'false' : 'true'}">${name}</button>`;
  }).join('')}</div>`;

/* ---------- sparkline: projected balance between now and pay day ---------- */
function sparkline(series, overdraft) {
  if (!series || series.length < 2) return '';
  const w = 600, h = 66, pad = 5;
  const vals = series.map(s => s.bal);
  const lo0 = Math.min(...vals), hi0 = Math.max(...vals), neg = lo0 < 0;
  const floor = overdraft > 0 ? -overdraft : null;
  // scale to the data with a little headroom, and pull the overdraft limit into
  // view when the line gets near it — that is the number worth watching
  const room = (hi0 - lo0) * 0.18 || Math.max(Math.abs(hi0) * 0.08, 1);
  let min = lo0 - room, max = hi0 + room * 0.5;
  if (!neg) min = Math.max(0, min);
  if (floor !== null && floor < min && lo0 - floor < (hi0 - lo0) + room * 3) min = floor - room * 0.5;
  const span = (max - min) || 1;
  const X = i => pad + (w - pad * 2) * i / (series.length - 1);
  const Y = v => pad + (h - pad * 2) * (1 - (v - min) / span);
  // a reference line is only drawn if it falls inside the box; otherwise it used
  // to be painted far outside the svg and drift up the page
  const inBox = v => v > min && v < max;
  const guide = (v, colour, dash) => inBox(v)
    ? `<line x1="${pad}" y1="${Y(v).toFixed(1)}" x2="${w - pad}" y2="${Y(v).toFixed(1)}"
        stroke="${colour}" stroke-width="1" stroke-dasharray="${dash}" vector-effect="non-scaling-stroke" opacity=".75"/>`
    : '';
  const line = series.map((s, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)} ${Y(s.bal).toFixed(1)}`).join(' ');
  const area = `${line} L${X(series.length - 1).toFixed(1)} ${h - pad} L${pad} ${h - pad} Z`;
  const last = series[series.length - 1];
  const hue = floor !== null && lo0 < floor ? 'var(--bad)' : neg ? 'var(--coral)' : 'var(--teal)';
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img"
      aria-label="Projected balance from ${esc(C.fmtD(series[0].date))} to ${esc(C.fmtD(last.date))}">
    <defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${hue}" stop-opacity=".28"/>
      <stop offset="100%" stop-color="${hue}" stop-opacity="0"/></linearGradient></defs>
    ${guide(0, 'var(--muted)', '3 3')}
    ${floor !== null ? guide(floor, 'var(--bad)', '4 4') : ''}
    <path d="${area}" fill="url(#sg)"/>
    <path d="${line}" fill="none" stroke="${hue}" stroke-width="2"
      stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
    <circle cx="${X(series.length - 1).toFixed(1)}" cy="${Y(last.bal).toFixed(1)}" r="3.2"
      fill="var(--card)" stroke="${hue}" stroke-width="2" vector-effect="non-scaling-stroke"/>
  </svg>`;
}

/* ---------- the optional weekend / bank-holiday shift ---------- */
function flowOptions() {
  const m = S.money, opt = flowOpt();
  const sample = (() => {                       // show the rule working on the next Sunday
    let d = C.today(); for (let i = 0; i < 8 && C.dow(d) !== 0; i++) d = C.addDays(d, 1);
    const s = C.shiftDue(d, opt.shift, opt.bankHols);
    return s.moved ? `A bill dated ${C.fmtDow(d)} would be taken ${C.fmtDow(s.date)}.`
      : `A bill dated ${C.fmtDow(d)} would be taken that same day.`;
  })();
  return `<div class="eyebrow mt4">When a bill lands on a non-working day</div>
    ${segment('shift', m.dueShift, [{ v: 'exact', l: 'Take the date' }, { v: 'next', l: 'Next working day' }, { v: 'prev', l: 'Day before' }])}
    <div class="note">${esc(sample)}</div>
    ${toggle('money.bankHols', m.bankHols, 'Count bank holidays too', 'England & Wales dates, worked out in the app — Easter included.')}`;
}

    }

    const done = S.house.filter(j => j.status === 'Done').length, tot = S.house.length;
    const tracked = cols.filter(c => c.total), have = tracked.reduce((a, c) => a + c.have, 0), all = tracked.reduce((a, c) => a + c.total, 0);
    h += `<div class="card"><h2>Everything else</h2>
      <div class="stats"><div class="stat"><b>${g.thisYear}</b><span>games this year</span></div><div class="stat"><b>${tot ? done + '/' + tot : '–'}</b><span>house jobs</span></div><div class="stat"><b>${all ? C.pct(have / all) : '–'}</b><span>collections</span></div></div>
      ${g.last ? `<div class="row mt4"><div class="l"><b>${esc(g.last.game)}</b><small>last completed · ${
        g.daysSince === 0 ? 'today' : g.daysSince === 1 ? 'yesterday' : g.daysSince + ' days ago'}</small></div></div>` : ''}
      <div class="btnrow"><button class="btn ghost sm" data-act="tab" data-tab="lists">Lists</button><button class="btn ghost sm" data-act="tab" data-tab="games">Games</button></div></div>`;

    return { title: `${S.name || 'Dec'}'s Tracker`, sub: C.fmtD(tod), html: h };
  },

  pay() {
    const p = payCalcNow();
    let idx = ui.payday ? p.rows.findIndex(x => x.payday === ui.payday) : -1;
    if (idx < 0) idx = p.nextIdx;
    const r = p.rows[idx];
    if (!r) return { title: 'Pay', sub: '', html: `<div class="card"><h2>No pay schedule</h2><div class="muted">Add your salary and next pay day under Payslip settings below.</div></div>` + paySettings(p) };
    let h = '';
    if (PAY_ONLY && SEED.generic && !S.pay.salary) h += `<div class="banner"><b>No data loaded yet.</b> Tap the gear at the top, then <b>Restore backup</b> and pick your data file. Your pay settings and hours appear straight away.</div>`;
    if (PAY_ONLY && !storageOK) h += `<div class="banner bad"><b>This device isn't keeping changes.</b> Open this file in Chrome rather than a file viewer, or host it, so it can save.</div>`;
    h += payslipCard(r);
    h += payBoard(p, idx, r);
    h += hpaCard(p);
    h += paySettings(p);
    return { title: PAY_ONLY ? (SEED.title || 'Pay') : 'Pay', sub: `${C.gbp(p.hourly)}/hr · 4-weekly`, html: h };
  },

  money() {
    const opt = flowOpt(), m = C.moneyCalc(S.money, null, opt), p = payCalcNow();
    const fl = C.runway(S.money, p, opt);
    const flows = C.periodFlows(S.money, p, opt, ui.flowPeriods);
    const cur = m.thisMonthKey;
    // the last twelve months and next month; the rest are one tap away
    const nextKey = C.addMonths(cur + '-01', 1).slice(0, 7), yearAgo = C.addMonths(cur + '-01', -11).slice(0, 7);
    const months = m.months.filter(x => ui.showAllMonths || (x.month <= nextKey && x.month >= yearAgo)).slice().reverse();
    const hiddenMonths = m.months.length - months.length;

    const sec = MONEY_SECTIONS.some(x => x.v === ui.moneyTab) ? ui.moneyTab : 'now';
    let h = moneySwitcher(sec);
    if (sec === 'now') {
    /* --- 1. cash flow to the next pay day --- */
    h += `<div class="card"><h2>Left until pay day<span class="hint">${fl.days} day${fl.days === 1 ? '' : 's'} · ${esc(C.fmtDM(fl.to))}</span></h2>`;
    if (fl.hasBal) {
      h += `<div class="flowhero"><div><div class="amt ${fl.safe < 0 ? 'neg' : ''}">${C.gbp(fl.safe)}</div>
          <div class="muted small">free to spend${fl.overdraft ? ', using your ' + C.gbp(fl.overdraft, 0) + ' overdraft' : ''}${fl.buffer ? ', keeping your ' + C.gbp(fl.buffer, 0) + ' buffer' : ''}</div></div>
        ${fl.perDay != null && fl.safe > 0 ? `<div class="per"><b>${C.gbp(fl.perDay)}</b>a day</div>` : ''}</div>
        <div class="sparkwrap">${sparkline(fl.series, fl.overdraft)}</div>
        <div class="results">
          <div class="r"><span>${fl.wasCarried ? 'Estimated balance today' : 'Balance today'}</span><span class="num">${C.gbp(fl.start)}</span></div>
          <div class="r"><span>${fl.events.length ? `${fl.events.length} bill${fl.events.length === 1 ? '' : 's'} still to leave` : 'No bills left before pay day'}</span><span class="num${fl.events.length ? ' neg' : ' muted'}">${fl.events.length ? '-' + C.gbp(fl.outgoings) : '—'}</span></div>
          ${fl.amexNow ? `<div class="r"><span>AMEX balance, taken off now</span><span class="num neg">-${C.gbp(fl.amexNow)}</span></div>` : ''}
          <div class="r"><span>Balance the morning of pay day</span><span class="num">${C.gbp(fl.atPayday)}</span></div>
          ${fl.overdraft && fl.low ? `<div class="r"><span>Overdraft left at the lowest point</span><span class="num${fl.headroom < 0 ? ' neg' : ''}">${C.gbp(fl.headroom)}</span></div>` : ''}
          ${fl.net != null ? `<div class="r"><span>Pay in ${esc(C.fmtDM(fl.to))}</span><span class="num pos">+${C.gbp(fl.net)}</span></div>
          ${fl.onPayOut ? `<div class="r"><span>${fl.onPay.length === 1 ? esc(fl.onPay[0].name) + ' on pay day' : fl.onPay.length + ' bills on pay day'}, out of the pay</span><span class="num neg">-${C.gbp(fl.onPayOut)}</span></div>` : ''}
          ${fl.amexOnPay ? `<div class="r"><span>AMEX cleared on pay day</span><span class="num neg">-${C.gbp(fl.amexOnPay)}</span></div>` : ''}
          <div class="r total"><span>Balance after pay</span><span class="num">${C.gbp(fl.afterPay)}</span></div>` : ''}
        </div>`;
      if (fl.shortfall) h += `<div class="banner bad"><b>${fl.overdraft ? 'Past your overdraft limit.' : 'Short before pay day.'}</b> The balance dips to ${C.gbp(fl.low.bal)} on ${esc(C.fmtD(fl.low.date))}${fl.overdraft ? ` — ${C.gbp(Math.abs(fl.headroom))} beyond your ${C.gbp(fl.overdraft, 0)} limit` : ''} — move something, or the direct debit bounces.</div>`;
      else if (fl.intoOverdraft) h += `<div class="banner"><b>Into your overdraft.</b> Lowest point is ${C.gbp(fl.low.bal)} on ${esc(C.fmtD(fl.low.date))} — ${C.gbp(fl.headroom)} of your ${C.gbp(fl.overdraft, 0)} limit still spare.</div>`;
      else if (fl.low && fl.buffer && fl.low.bal < fl.buffer) h += `<div class="banner"><b>It gets tight.</b> Lowest point is ${C.gbp(fl.low.bal)} on ${esc(C.fmtD(fl.low.date))}, under your ${C.gbp(fl.buffer, 0)} buffer.</div>`;
    } else {
      h += `<div class="banner info">Put today's bank balance in below and this works out what's genuinely free to spend before ${esc(C.fmtD(fl.to))} — bills counted on the day they actually leave.</div>
        <div class="results"><div class="r"><span>${fl.events.length ? `${fl.events.length} bill${fl.events.length === 1 ? '' : 's'} still to leave` : 'No bills left before pay day'}</span><span class="num${fl.events.length ? ' neg' : ' muted'}">${fl.events.length ? '-' + C.gbp(fl.outgoings) : '—'}</span></div>
        ${fl.net != null ? `<div class="r"><span>Pay in ${esc(C.fmtDM(fl.to))}</span><span class="num pos">+${C.gbp(fl.net)}</span></div>` : ''}
        ${fl.onPayOut ? `<div class="r"><span>Bills on pay day, out of the pay</span><span class="num neg">-${C.gbp(fl.onPayOut)}</span></div>` : ''}</div>`;
    }
    h += `${fl.wasCarried || fl.adj ? `<div class="note mt2">${fl.wasCarried ? 'Carried forward from' : 'Worked from'} the <b>${C.gbp(fl.typed)}</b> you entered on ${esc(C.fmtD(S.money.balanceOn))}${fl.carriedOut ? `, less <b>${C.gbp(fl.carriedOut)}</b> of bills` : ''}${fl.carriedIn ? `, plus <b>${C.gbp(fl.carriedIn)}</b> of pay` : ''}${fl.adj ? `, ${fl.adj < 0 ? 'less' : 'plus'} <b>${C.gbp(Math.abs(fl.adj))}</b> paid off the card with Pay now` : ''}${fl.wasCarried ? ' since' : ''}.</div>` : ''}
      ${fl.wasCarried ? detailsBlock('carried', `What's come off since ${C.fmtDM(fl.typedOn)}`,
        `<div class="ledger">${fl.carried.map(e => ledgerRow(e, null, true)).join('')}${fl.carriedPays.map(r => `<div class="lrow gone"><div class="ld"><span>${esc(C.DOW[C.dow(r.payday)])}</span>${+r.payday.slice(8)}</div>
          <div class="ln"><b>Pay day</b><small>${esc(C.fmtM(C.mkey(r.payday)))}</small></div><div class="lv pos">+${C.gbp(r.net)}</div></div>`).join('')}</div>
         <div class="note">Only bills and pay are counted here. Day-to-day spending isn't — so retype your balance whenever you check the bank, and the running total starts again from that figure.</div>`) : ''}
      <div class="grid2 mt14"><div class="full">${field(fl.typedOn ? `Balance (${C.fmtDM(fl.typedOn)})` : 'Bank balance today', signedInp('money.balance', S.money.balance, 'placeholder="e.g. 1240.50"'))}</div>
      ${field('Buffer to keep back', inp('money.buffer', S.money.buffer))}${field('Overdraft limit', inp('money.overdraft', S.money.overdraft, 'number', 'min="0" placeholder="0"'))}</div>
      <div class="sep"></div>
      <div class="eyebrow">American Express</div>
      <div class="grid2">${field('Card balance owed', inp('money.amex', S.money.amex, 'number', 'min="0" placeholder="0.00"'))}</div>
      ${toggle('money.amexBefore', S.money.amexBefore, 'Take it off before pay day',
        "Leave this off if you clear the card on pay day — it still comes off the balance after pay, just not out of what's free before it.")}
      <div class="btnrow">
        ${fl.amex ? `<button class="btn teal" data-act="amexClear">Pay now</button>` : ''}
        ${S.money.amexUndo ? `<button class="btn ghost" data-act="amexUndo">Undo, put ${C.gbp(Math.abs(C.num(S.money.amexUndo.amex)))} back</button>` : ''}
      </div>
      ${S.money.amexUndo ? `<div class="note">Paid ${esc(C.fmtD(S.money.amexUndo.at))}. The undo stays until you change the balance or the card yourself.</div>`
        : `<div class="note"><b>Pay now</b> records that you have paid it — ${fl.amex ? C.gbp(fl.amex) + ' off' : 'it comes off'} your balance and the card goes to zero. It doesn't make the payment, and nothing happens on its own: the figures above stay a projection until you press it.</div>`}
      ${fl.amex ? `<div class="note">${fl.amexBefore
        ? `The <b>${C.gbp(fl.amex)}</b> is counted against you now, so it is already out of the figure at the top.`
        : `The <b>${C.gbp(fl.amex)}</b> is left alone until ${esc(C.fmtDM(fl.to))}, then taken off what lands. It is not in the figure at the top.`}</div>` : ''}
      <div class="sep"></div>
      <div class="note">Your overdraft is the most you can go into minus before a payment bounces — leave it at 0 if you haven't got one. It counts as spendable room, so the figure above is what's free <i>including</i> it.
      Retype the balance whenever you check your bank — the running total restarts from whatever you enter, and bills come off again as the days pass. Overdrawn? Type the amount, then tap <b>+</b> beside it to flip it to <b>−</b>.</div>
      ${fl.paydayPassed ? `<div class="banner mt12"><b>Pay day has been since you typed this.</b> The figures above are worked forward from ${esc(C.fmtD(fl.typedOn))} — check your bank and retype it.${fl.amex ? ` Paid the card? Press <b>Pay now</b> under American Express.` : ''}</div>`
        : fl.staleDays >= 14 ? `<div class="banner mt12"><b>That balance is ${fl.staleDays} days old.</b> Only bills have come off it since — anything you've actually spent hasn't. Check your bank and retype it.</div>` : ''}
      ${m.undated ? `<div class="banner mt12"><b>${m.undated === 1 ? 'One bill has' : m.undated + ' bills have'} no payment date.</b> ${m.undated === 1 ? "It's" : "They're"} missing from these figures — add the day of the month ${m.undated === 1 ? 'it leaves' : 'each one leaves'} in <b>Bills</b>.</div>` : ''}
      ${fl.events.length || fl.onPay.length ? `<div class="sep"></div><div class="eyebrow">Every payment between now and pay day</div><div class="ledger">${
        (() => { let bal = fl.hasBal ? C.r2(fl.start - fl.amexNow) : null;      // the card is already out if it goes before pay day
          const run = amt => bal === null ? null : (bal = C.r2(bal + amt));
          const day = `<div class="ld"><span>${esc(C.DOW[C.dow(fl.to)])}</span>${+fl.to.slice(8)}</div>`;
          const small = v => v === null ? '' : `<small class="${v < 0 ? 'neg' : ''}">${C.gbp(v)}</small>`;
          return fl.events.map(e => ledgerRow(e, run(-e.amount))).join('')
            + (fl.net != null ? `<div class="lrow pay">${day}<div class="ln"><b>Pay day</b><small>${esc(C.fmtM(C.mkey(fl.to)))}</small></div>
              <div class="lv pos">+${C.gbp(fl.net)}${small(run(fl.net))}</div></div>
              ${fl.onPay.map(e => ledgerRow(e, run(-e.amount))).join('')}
              ${fl.amexOnPay ? `<div class="lrow">${day}<div class="ln"><b>AMEX cleared</b><small>card balance</small></div>
                <div class="lv">-${C.gbp(fl.amexOnPay)}${small(run(-fl.amexOnPay))}</div></div>` : ''}` : ''); })()
      }</div>` : ''}
      <div class="sep"></div>${flowOptions()}</div>`;

    /* --- 1b. what the balance readings say has actually been spent --- */
    h += spendCard(C.spendLog(S.money, p, opt), fl);

    /* --- 2. disposable income per pay period --- */
    h += `<div class="card"><h2>Disposable by pay period<span class="hint">from bill dates</span></h2>
      <div class="muted small">You're paid every 28 days but bills come out monthly, so some periods carry two of the same bill and some carry none. This counts what actually leaves inside each period.</div>
      <div class="mt10">${flows.map(f => {
        const dupes = {}; f.events.forEach(e => { dupes[e.name] = (dupes[e.name] || 0) + 1; });
        const twice = Object.keys(dupes).filter(k => dupes[k] > 1);
        const share = f.net > 0 ? Math.min(f.outgoings / f.net, 1) : 0;
        return `<div class="perrow"><div><b>${esc(C.fmtDM(f.from))} – ${esc(C.fmtDM(f.to))}</b>
            <small class="meta">${C.gbp(f.net, 0)} in · ${C.gbp(f.outgoings, 0)} out · ${f.events.length} bills${twice.length ? ' · twice: ' + esc(twice.join(', ')) : ''}</small></div>
          <div class="num tr"><b class="strong ${f.disposable < 0 ? 'neg' : ''}">${C.gbp(f.disposable, 0)}</b>
            <div class="muted small">${C.pct(share)} on bills</div></div>
          <div class="pb">${bar(share, share > 0.85 ? 'coral' : share > 0.7 ? 'amber' : 'teal')}</div></div>`;
      }).join('') || '<div class="empty">Add bill payment dates and your pay details to see this.</div>'}</div>
      ${flows.length ? `<div class="btnrow"><button class="btn ghost sm" data-act="morePeriods">${ui.flowPeriods >= 12 ? 'Show fewer' : 'Show more periods'}</button></div>` : ''}
      ${flows.length ? `<div class="note">Average disposable across these ${flows.length} periods: <b>${C.gbp(C.r2(flows.reduce((a, f) => a + f.disposable, 0) / flows.length))}</b>. Bills that stop or start are honoured, and linked debt repayments follow the debt list.</div>` : ''}</div>`;

    }
    if (sec === 'history') {
    /* --- 3. history --- */
    h += `<div class="card"><h2>By year</h2><div class="tscroll"><table class="table"><tr><th>Year</th><th>Earnings</th><th>Bills</th><th>Disposable</th><th>Saved</th><th>Rate</th></tr>
      ${m.byYear.filter(y => y.n || y.saved).map(y => `<tr><td>${y.year}</td><td>${C.gbp(y.earnings, 0)}</td><td>${C.gbp(y.outgoings, 0)}</td><td>${C.gbp(y.disposable, 0)}</td><td>${C.gbp(y.saved, 0)}</td><td>${C.pct(y.rate)}</td></tr>`).join('') || '<tr><td colspan="6" class="muted">No months filled in yet.</td></tr>'}</table></div>
      ${m.last12.length ? `<div class="chartwrap"><canvas id="chart" role="img" aria-label="Earnings and disposable income, month by month, for the last ${m.last12.length} months"></canvas></div><div class="chartkey"><span><i class="k-brand"></i>Earnings</span><span><i class="k-teal"></i>Disposable</span><span class="muted">last 12 months — swipe to see them all</span></div>` : ''}</div>`;
    h += `<div class="card"><h2>Month by month</h2><div class="muted small">Type earnings and what you actually saved. Bills and disposable work themselves out.</div>
      ${months.map(x => { const i = S.money.months.findIndex(q => q.month === x.month); return `<div class="mrow"><div class="mhead"><b>${esc(C.fmtM(x.month))}</b><span class="disp ${x.disposable < 0 ? 'neg' : ''}">${x.has ? C.gbp(x.disposable) : '<span class="muted semi">no earnings yet</span>'}</span></div>
        <div class="mgrid">${field('Earnings', inp(`money.months.${i}.earnings`, x.earnings))}${field('Actually saved', signedInp(`money.months.${i}.saved`, x.saved))}</div>
        ${x.has ? `<div class="note">Bills ${C.gbp(x.outgoings)} · potential savings ${C.gbp(x.potential)} (disposable minus the ${C.gbp(S.money.buffer, 0)} buffer)</div>` : ''}</div>`; }).join('') || '<div class="empty">No months yet.</div>'}
      <div class="btnrow">${ui.showAllMonths || hiddenMonths ? `<button class="btn ghost sm" data-act="toggle" data-key="showAllMonths">${ui.showAllMonths ? 'Show the last year' : `Show all months (${hiddenMonths} more)`}</button>` : ''}<button class="btn sm" data-act="addMonth">Add ${esc(C.fmtM(nextMonthKey()))}</button></div></div>`;

    }
    if (sec === 'bills') {
    /* --- 4. bills --- */
    h += `<div class="card"><h2>Bills</h2><div class="row"><div class="l"><b>Active bills total</b><small>${m.active.length} bills · ${m.dated.length} with a payment date</small>${
        m.anySkips ? `<small>${C.gbp(m.yearTotal, 0)} a year, allowing for months off</small>` : ''}</div><div class="strong num">${C.gbp(m.activeTotal)}</div></div>
      ${m.reviews.map(b => `<div class="banner mt12"><b>${esc(b.name || 'A bill')} changes in ${esc(C.MON[b.review - 1])}.</b>
        Check what it has gone to and type the new amount — the old price is kept, so the history still adds up.
        <div class="btnrow"><button class="btn ghost sm" data-act="billChecked" data-id="${esc(b.id)}">Still ${C.gbp(b.amt)}</button></div></div>`).join('')}
      ${ui.editBills ? m.bills.map((b, i) => `<div class="erow">${field('Bill', inp(`money.bills.${i}.name`, b.name, 'text'))}${field('Category', sel(`money.bills.${i}.category`, b.category, CATS))}
          ${field(b.link ? 'Amount (linked to ' + b.link.toLowerCase() + ' debt repayments)' : 'Amount', b.link ? `<input type="text" value="${C.gbp(b.amt)}" disabled>` : inp(`money.bills.${i}.amount`, b.amount))}
          ${field('Day of month it leaves', inp(`money.bills.${i}.dueDay`, b.dueDay, 'number', 'min="1" max="31" step="1" placeholder="1–31"'))}
          ${field('Started', inp(`money.bills.${i}.started`, b.started, 'month'))}${field('Last payment (blank = ongoing)', inp(`money.bills.${i}.ended`, b.ended, 'month'))}
          ${field('Price changes in', selPairs(`money.bills.${i}.review`, b.review,
            [{ v: '', l: "Doesn't change" }].concat(C.MON.map((n, k) => ({ v: k + 1, l: n })))))}
          ${b.reviewedOn ? field('Last checked', `<input type="text" value="${esc(C.fmtM(b.reviewedOn))}" disabled>`) : ''}
          <div class="full field"><label>Months it is paid${b.paidMonths < 12 ? ` · ${b.paidMonths} of 12` : ''}</label>${monthPicker(i, b.skip)}</div>
          <div class="full"><button class="btn danger sm" data-act="delBill" data-i="${i}" aria-label="Remove ${esc(b.name || 'this bill')}">Remove this bill</button></div></div>`).join('') || '<div class="empty">No bills yet.</div>'
        : m.bills.map(billRow).join('') || '<div class="empty">No bills yet.</div>'}
      <div class="btnrow"><button class="btn ghost sm" data-act="toggle" data-key="editBills">${ui.editBills ? 'Done' : 'Edit bills'}</button>${ui.editBills ? '<button class="btn sm" data-act="addBill">Add bill</button>' : ''}</div>
      ${(() => { const cats = Object.entries(m.byCat).filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1]);
        return cats.length > 1 ? `<div class="sep"></div><div class="eyebrow">Where it goes each month</div>
          ${cats.map(([k, v]) => `<div class="prow"><span><b>${esc(k)}</b></span><span class="num muted small">${C.gbp(v, 0)} · ${C.pct(v / m.activeTotal)}</span>${bar(v / m.activeTotal, 'teal')}</div>`).join('')}` : ''; })()}
      <div class="note">The day of the month is what makes the cash flow in <b>Now</b> work. Use 31 for "last day" — short months fall back to the 28th, 29th or 30th automatically. Change an amount and the app offers to keep the old price, which is what builds the Price changes card underneath.</div></div>`;

    /* --- 4b. what bills have done over time --- */
    const hist = C.priceHistory(S.money.bills);
    if (hist.length) {
      const monthly = C.r2(hist.reduce((a, x) => a + x.total, 0));
      const recent = hist.filter(x => x.last.month >= C.mkey(C.addMonths(C.today(), -12)));
      h += `<div class="card"><h2>Price changes<span class="hint">${hist.length} bill${hist.length === 1 ? '' : 's'}</span></h2>
        <div class="row"><div class="l"><b>${monthly >= 0 ? 'More' : 'Less'} than when you started tracking</b><small>across ${hist.length} bill${hist.length === 1 ? '' : 's'} that have changed price</small></div>
          <div class="num tr"><b class="strong ${monthly > 0 ? 'neg' : 'pos'}">${monthly > 0 ? '+' : ''}${C.gbp(monthly)}</b><div class="muted small">${monthly > 0 ? '+' : ''}${C.gbp(monthly * 12, 0)} a year</div></div></div>
        ${hist.map(x => `<div class="prow"><div><b>${esc(x.name)}</b>
            <small class="meta">${C.gbp(x.first)} ${esc(C.fmtMs(x.since))} → ${C.gbp(x.current)} now${x.changes.length > 1 ? ` · ${x.changes.length} changes` : ''}</small></div>
          <div class="num tr"><b class="${x.total > 0 ? 'neg' : 'pos'}">${x.total > 0 ? '+' : ''}${C.gbp(x.total)}</b>
            <div class="muted small">${esc(C.fmtMs(x.last.month))} ${x.last.diff > 0 ? '+' : ''}${C.gbp(x.last.diff)}</div></div>
          <div class="pb">${(() => { const w = hist.reduce((m, y) => Math.max(m, Math.abs(y.total)), 0) || 1;
            return bar(Math.abs(x.total) / w, x.total > 0 ? 'coral' : 'teal'); })()}</div></div>`).join('')}
        ${recent.length ? `<div class="note">${recent.length === 1 ? 'One bill has' : recent.length + ' bills have'} changed in the last year: ${esc(recent.map(x => x.name).join(', '))}.</div>` : ''}
        <div class="note">Built from the history you keep when a price changes. Edit a bill's amount and the app offers to keep the old one — that is what fills this in.</div></div>`;
    }

    }
    if (sec === 'saving') {
    /* --- 4c. the savings pot, and the list it has to stretch across --- */
    const sv = C.savingsCalc(S.money.savings, m.debts, null, S.money.netLongTerm);
    h += `<div class="card"><h2>Savings pot${sv.monthly ? `<span class="hint">${C.gbp(sv.monthly)} a month going in</span>` : ''}</h2>

    h += `<div class="card"><h2>Saving for${sv.goals.length ? `<span class="hint">${sv.affordable ? sv.affordable + ' you can get now' : sv.goals.length + ' thing' + (sv.goals.length === 1 ? '' : 's')}</span>` : ''}</h2>

        <div class="r"><span>Everything on the list</span><span class="num">${C.gbp(sv.wanted)}</span></div>

      ${ui.editGoals ? S.money.savings.goals.map((g, i) => `<div class="erow"><div class="full">${field('Saving for', inp(`money.savings.goals.${i}.name`, g.name, 'text'))}</div>
          ${field('What it costs', inp(`money.savings.goals.${i}.cost`, g.cost))}${field('Got it on', inp(`money.savings.goals.${i}.got`, g.got, 'date'))}
          <div class="full"><button class="btn danger sm" data-act="delGoal" data-id="${esc(g.id)}" aria-label="Remove ${esc(g.name || 'this')}">Take it off the list</button></div></div>`).join('') || '<div class="empty">Nothing on the list yet.</div>'
        : sv.goals.map(g => goalRow(g, true)).join('') || '<div class="empty">Nothing on the list yet. Add what you are saving up for and the pot gets measured against it.</div>'}
      <div class="btnrow"><button class="btn ghost sm" data-act="toggle" data-key="editGoals">${ui.editGoals ? 'Done' : 'Edit list'}</button><button class="btn sm" data-act="addGoal">Add something</button></div>
      ${sv.got.length ? detailsBlock('gotlist', `Already got (${sv.got.length}) · ${C.gbp(sv.spent, 0)}`, sv.got.map(gotRow).join('')) : ''}
      <div class="note">Every price here is measured against the whole pot, because it is one pile of money. <b>Got it</b> takes what you paid out of the pot and moves the thing down to <b>Already got</b>.</div></div>`;

    /* --- 5. debt --- */
    h += `<div class="card"><h2>Debt</h2><div class="row"><div class="l"><b>Total owed</b><small>${C.gbp(m.repayTotal)} a month in repayments</small></div><div class="strong num">${C.gbp(m.debtTotal)}</div></div>
      ${m.rateReviews.map(d => `<div class="banner mt12"><b>${esc(d.name || 'A debt')}: the fixed rate ended ${esc(C.fmtM(d.rateEnds))}.</b>
        Everything below still assumes ${C.rate(d.apr)}. Put the new rate and the balance off your statement in, and set the next end date.
        <div class="btnrow"><button class="btn ghost sm" data-act="toggle" data-key="editDebts">Update it</button></div></div>`).join('')}
      ${m.noRateDebts.map(d => `<div class="banner bad mt12"><b>${esc(d.name || 'A debt')} has no APR.</b>
        It is being carried forward with the whole ${C.gbp(d.repayment)} coming off the balance and no interest going back on,

      ${ui.editDebts ? m.debts.map((d, i) => `<div class="erow">${field('Debt', inp(`money.debts.${i}.name`, d.name, 'text'))}${field('Type', sel(`money.debts.${i}.type`, d.type, ['Short-term', 'Long-term']))}
          ${field(d.now.on ? `Balance (${C.fmtDM(d.now.on)})` : 'Balance', inp(`money.debts.${i}.balance`, d.now.typed || null))}${field('Monthly repayment', inp(`money.debts.${i}.repayment`, d.repayment, 'number', 'min="0"'))}
          ${field('APR %', pctInp(`money.debts.${i}.apr`, d.apr))}${field('Balance true on', inp(`money.debts.${i}.balanceOn`, d.now.on, 'date'))}
          ${field('Fixed rate ends', inp(`money.debts.${i}.rateEnds`, d.rateEnds, 'month'))}<div class="full"><button class="btn danger sm" data-act="delDebt" data-i="${i}" aria-label="Remove ${esc(d.name || 'this debt')}">Remove this debt</button></div></div>`).join('') || '<div class="empty">No debts. Nice.</div>'
        : m.debts.map(debtRow).join('') || '<div class="empty">No debts. Nice.</div>'}
      <div class="btnrow"><button class="btn ghost sm" data-act="toggle" data-key="editDebts">${ui.editDebts ? 'Done' : 'Edit debts'}</button>${ui.editDebts ? '<button class="btn sm" data-act="addDebt">Add debt</button>' : ''}</div>
      <div class="note">Balances look after themselves: each repayment comes off on the day it leaves, with interest put back on at a twelfth of the APR, so a mortgage drops by far less than its repayment. When a debt clears, its repayment stops leaving too. Retype a balance off a statement to start it again from that day. Change the rate and any fixed-term reminder is cleared, ready for the new end date. 
      Without an APR there is no interest — right for a 0% deal, badly optimistic for anything else.</div></div>`;
    }
    return { title: 'Money', chart: sec === 'history' ? m.last12 : null, sub: fl.hasBal ? C.gbp(fl.safe, 0) + ' free · ' + (fl.days === 0 ? 'pay day today' : fl.days + ' day' + (fl.days === 1 ? '' : 's') + ' to pay day') : (m.latest ? 'latest: ' + C.fmtM(m.latest.month) : ''), html: h };

      <div class="field searchbox"><input type="search" id="search" placeholder="Search…" aria-label="Search this collection" value="${esc(ui.search)}"></div>

const CATS = ['Housing', 'Utilities', 'Insurance', 'Transport', 'Phone', 'Subscriptions', 'Health & Fitness', 'Debt & Finance', 'Other'];

/* ---------- components ---------- */
function ledgerRow(e, runningBal, gone) {
  return `<div class="lrow${gone ? ' gone' : ''}"><div class="ld"><span>${esc(C.DOW[C.dow(e.date)])}</span>${+e.date.slice(8)}</div>
    <div class="ln"><b>${esc(e.name)}</b><small>${esc(e.category)}${e.date === C.today() ? '<span class="moved today">today</span>' : ''}${e.moved ? `<span class="moved">${esc(e.why)} → moved</span>` : ''}</small></div>
    <div class="lv">-${C.gbp(e.amount)}${runningBal !== null && runningBal !== undefined ? `<small class="${runningBal < 0 ? 'neg' : ''}">${C.gbp(runningBal)}</small>` : ''}</div></div>`;
}
/* A bill in the list. The amount column holds one figure on every row, so the
   column lines up down the card; anything worth saying beyond the day it leaves
   — months off, a final payment coming, a debt it pays — gets a line of its
   own underneath rather than being run on until it wraps. */
function billRow(b) {
  const extra = [];
  if (b.link) extra.push(`follows your ${esc(b.link.toLowerCase())} debt repayments${b.clears ? ', last one clears ' + esc(C.fmtM(b.clears)) : ''}`);
  if (b.paidMonths < 12) extra.push(`paid ${b.paidMonths} months a year, ${C.gbp(b.yearly, 0)} a year`);
  if (b.notYet) extra.push(`starts ${esc(C.fmtM(b.started))}`);
  if (b.finished) extra.push(`finished ${esc(C.fmtM(b.ended))}`);
  // with no payment date there is nothing to count, so it just says when it ends
  else if (b.ended) extra.push(b.left === null ? `ends ${esc(C.fmtM(b.ended))}`
    : b.left ? `${b.left} payment${b.left === 1 ? '' : 's'} left, last in ${esc(C.fmtM(b.ended))}` : `last payment made, ends ${esc(C.fmtM(b.ended))}`);
  return `<div class="row"><div class="l"><b>${esc(b.name)}</b>
    <small>${esc(b.category || '')}${C.num(b.dueDay) ? ' · ' + esc(C.ord(Math.round(C.num(b.dueDay)))) + ' of the month' : ' · <span class="warn">no date set</span>'}</small>
    ${extra.length ? `<small>${extra.join(' · ')}</small>` : ''}</div>
    <div class="num tr${b.finished || b.notYet ? ' dim' : ''}">${C.gbp(b.amt)}</div></div>`;
}
/* A debt. Words on the left, figures on the right, and every line short
   enough to stay one line on a narrow phone: measured, not guessed, because a
   mortgage balance makes the figures column wide. */
function debtRow(d) {
  const cleared = d.now.cleared || (d.now.on && d.balance <= 0);
  const status = cleared ? '<b class="pos">Cleared</b>'
    : !d.payoff ? ''
    : d.payoff.never ? '<span class="warn">Won\'t clear at this rate</span>'
    : `Expected clear ${esc(C.fmtM(d.payoff.date))}`;
  const figures = [];
  if (!cleared && d.payoff && !d.payoff.never) figures.push(`${d.payoff.months} payment${d.payoff.months === 1 ? '' : 's'} left`);
  if (d.now.noRate) figures.push('<span class="warn">no APR set</span>');
  else if (d.now.interest) figures.push(`${C.gbp(d.now.interest, 0)} interest`);
  return `<div class="row"><div class="l"><b>${esc(d.name)}</b>
    <small>${esc(d.type)} · ${C.gbp(d.repayment)} a month</small>
    ${status ? `<small>${status}</small>` : ''}
    ${d.now.carried ? `<small>From ${C.gbp(d.now.typed, 0)} on ${esc(C.fmtDM(d.now.on))}</small>` : ''}</div>
    <div class="num tr"><b>${C.gbp(d.balance)}</b>${figures.map(f => `<div class="muted small">${f}</div>`).join('')}</div></div>`;
}
/* One thing being saved for, measured against the whole pot. `actions` adds the
   Got it button: Money gets it, Home does not, since the dashboard is for
   reading and money is moved where the savings live. */
function goalRow(g, actions) {
  return `<div class="prow"><div><b>${esc(g.name || 'Something')}</b>
      <small class="meta">${g.cost
        ? (g.covered ? 'you have enough for this'
          : C.gbp(g.short) + ' short'
            + (g.by ? ' · there by ' + esc(C.fmtM(C.mkey(g.by))) : g.stalled ? ' · nothing going in' : ''))
        : 'no price on it yet'}</small></div>
    <div class="num tr"><b>${C.gbp(g.cost)}</b>${g.pct !== null ? `<div class="muted small">${C.pct(g.pct)}</div>` : ''}</div>
    ${g.pct !== null ? `<div class="pb">${bar(g.pct, g.covered ? '' : 'teal')}</div>` : ''}
    ${actions === true ? `<div class="potact">
      <button class="btn ${g.covered ? 'teal' : 'ghost'} sm" data-act="goalGot" data-id="${esc(g.id)}">Got it</button></div>` : ''}</div>`;
}
/* Something already bought, and what actually came out of the pot for it. */
function gotRow(g) {
  return `<div class="row"><div class="l"><b>${esc(g.name || 'Something')}</b>
      <small>got ${esc(C.fmtD(g.got))}${g.paid && g.cost && C.r2(g.paid) !== C.r2(g.cost) ? ' · listed at ' + C.gbp(g.cost, 0) : ''}</small></div>
    <div class="num tr">${C.gbp(g.paid)}</div><button class="del" data-act="delGoal" data-id="${esc(g.id)}" aria-label="Remove ${esc(g.name || 'this')}">×</button></div>`;
}
/* ---- the Pay tab, in pieces ---- */
const resRow = (l, v, cls = '') => `<div class="r ${cls}"><span>${esc(l)}</span><span class="num">${v}</span></div>`;
function payslipCard(r) {

      <div class="hours">${stepper('Overtime hours', r.payday, 'ot', r.ot)}${stepper('Sunday hours', r.payday, 'sun', r.sun)}</div>
      <div class="results">
        ${resRow('Basic pay', C.gbp(r.basic))}${r.allow ? resRow('Allowances', C.gbp(r.allow)) : ''}
        ${resRow('Overtime pay', C.gbp(r.otPay))}${resRow(SUN, C.gbp(r.sunPay))}${r.backpay ? resRow('Backpay (estimate)', C.gbp(r.backpay)) : ''}${r.hpaPay ? resRow('EU Holiday Pay' + (S.pay.hpaHistory[String(+r.refYear - 1)] != null && S.pay.hpaHistory[String(+r.refYear - 1)] !== '' ? '' : ' (estimate)'), C.gbp(r.hpaPay)) : ''}${r.sacr ? resRow('Salary sacrifice', '-' + C.gbp(r.sacr)) : ''}
        ${resRow('Taxable pay', C.gbp(r.taxable))}${resRow('PAYE', r.paye < 0 ? '+' + C.gbp(-r.paye) + '<small>tax back</small>' : r.paye ? '-' + C.gbp(r.paye) : C.gbp(0))}${resRow('National Insurance', '-' + C.gbp(r.ni))}${r.after ? resRow('After-tax deductions', '-' + C.gbp(r.after)) : ''}
        ${resRow(r.actual !== null ? 'Net pay (your payslip)' : 'Net pay (projected)', C.gbp(r.net), 'total')}
        ${r.actual !== null ? resRow('Projected was', C.gbp(r.projected) + '<small>' + (
          !r.diff ? 'spot on' : C.gbp(Math.abs(r.diff)) + (r.diff > 0 ? ' under the payslip' : ' over the payslip')) + '</small>') : ''}
      </div>

        `placeholder="${r.projected.toFixed(2)}"`))}</div>
      <div class="note">Your payslip usually turns up a few days before the money does. Type the net off it and everything
        — the cash flow, what is free before the next pay day, the year's total — uses that instead of the projection.
        The breakdown above stays as it was worked out, because that is what explains the figure. Clear the box to go back to the projection.</div>
      ${/* last in the card on purpose: it bleeds to the edges and rounds off the bottom */ ''}
      <div class="results">${resRow('Extra from overtime', r.extraGross ? C.gbp(r.extra) + '<small>you keep ' + C.pct(r.keep) + '</small>' : '–', 'extra')}</div></div>`;
}
/* Every pay day in the schedule, grouped by year; the selected one is highlighted */
function payBoard(p, idx, r) {
  const groups = [];
  p.rows.forEach((x, i) => { const y = x.payday.slice(0, 4); let g = groups[groups.length - 1];
    if (!g || g.y !== y) groups.push(g = { y, rows: [] }); g.rows.push({ x, i }); });
  const thisYear = C.today().slice(0, 4), selYear = r.payday.slice(0, 4);
  groups.forEach(g => { if (ui.openYears[g.y] === undefined) ui.openYears[g.y] = (g.y === thisYear || g.y === selYear); });
  const years = groups.map(g => {
    const open = !!ui.openYears[g.y], logged = g.rows.filter(({ x }) => x.ot || x.sun).length;
    const head = `<button class="yearhdr" data-act="yeartoggle" data-y="${g.y}" aria-expanded="${open}"><span>${g.y}</span><span class="ym">${logged ? logged + ' with hours · ' : ''}${g.rows.length} pay days<i aria-hidden="true">${open ? '−' : '+'}</i></span></button>`;
    if (!open) return head;
    return head + g.rows.map(({ x, i }) => `<button class="brow ${x.past ? 'past' : ''} ${x.next ? 'nextpd' : ''} ${i === idx ? 'sel' : ''}" data-act="pick" data-payday="${x.payday}"${i === idx ? ' aria-current="true"' : ''}>

/* ---------- chart ---------- */
function cssVar(n, fallback) {
  const v = getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  return v || fallback;
}
/* The view that owns the chart hands its rows over in what it returns; the
   money maths used to be run a second time here just to get them back. */
let chartData = null;
function drawChart() {
  const cv = $('#chart'); if (!cv) return;
  const data = chartData; if (!data || !data.length) return;
  const dpr = window.devicePixelRatio || 1, H = 210, padL = 44, padB = 26, padT = 10;
  const avail = (cv.parentElement && cv.parentElement.clientWidth) || 320;
  const W = Math.max(avail, padL + 6 + 46 * data.length);        // give every month room; the wrapper scrolls
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  cv.width = W * dpr; cv.height = H * dpr;
  const x = cv.getContext && cv.getContext('2d'); if (!x) return;
  x.scale(dpr, dpr);
  const ink = cssVar('--muted', '#667085'), line = cssVar('--line', '#E4E9F0');
  const c1 = cssVar('--brand', '#1F3A5F'), c2 = cssVar('--teal', '#2A9D8F');
  /* The scale goes up in round steps — £1k, £2k, £3k — rather than quarters
     of the biggest month, which printed "£2k" twice once they were rounded. */
  const steps = 4, top = Math.max(...data.map(d => C.num(d.earnings)), 1) / steps;
  const mag = Math.pow(10, Math.floor(Math.log10(top)));
  const step = [1, 2, 2.5, 5, 10].map(f => f * mag).find(s => s >= top);
  const max = step * steps, gw = (W - padL - 6) / data.length;
  x.font = '10px ' + getComputedStyle(document.body).fontFamily; x.fillStyle = ink; x.strokeStyle = line;
  for (let i = 0; i <= steps; i++) {
    const v = step * i, y = padT + (H - padT - padB) * (1 - v / max);
    x.beginPath(); x.moveTo(padL, y); x.lineTo(W, y); x.stroke();
    x.textAlign = 'right'; x.fillText('£' + (v >= 1000 ? +(v / 1000).toFixed(1) + 'k' : v), padL - 6, y + 3);
  }
  data.forEach((d, i) => {
    const x0 = padL + i * gw + gw * 0.15, bw = gw * 0.32;
    const he = (H - padT - padB) * C.num(d.earnings) / max, hd = (H - padT - padB) * Math.max(C.num(d.disposable), 0) / max;
