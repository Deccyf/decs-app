      const pot = has ? Math.max(disp - num(m.buffer), 0) : null;
      return { ...x, has, outgoings: out, disposable: disp, potential: pot, savedN: num(x.saved) };
    });
    const byYear = {};
    months.forEach(x => { const y = x.month.slice(0, 4); const o = byYear[y] = byYear[y] || { year: y, earnings: 0, outgoings: 0, disposable: 0, potential: 0, saved: 0, n: 0 };
      if (x.has) { o.earnings += num(x.earnings); o.outgoings += x.outgoings; o.disposable += x.disposable; o.potential += x.potential; o.n++; }
      o.saved += x.savedN; });
    Object.values(byYear).forEach(o => o.rate = o.earnings ? o.saved / o.earnings : null);
    const withData = months.filter(x => x.has);
    const latest = withData.length ? withData[withData.length - 1] : null;
    const ly = latest ? latest.month.slice(0, 4) : tod.slice(0, 4);
    const yearRow = byYear[ly] || null;
    const thisMonthKey = mkey(tod);
    const debtCalc = debts.map(d => ({ ...d, payoff: debtPayoff(d, tod) }));
    const debtTotal = debts.reduce((a, d) => a + num(d.balance), 0);
    const repayTotal = debts.reduce((a, d) => a + num(d.repayment), 0);
    const st = debtCalc.filter(d => d.type === 'Short-term');
    const stTotal = st.reduce((a, d) => a + num(d.balance), 0);

  function last12(months, latest) {

    if (!d.apr) return { months: Math.ceil(B / P), date: addMonths(tod, Math.ceil(B / P)), naive: true };

  }

})();

        : m.bills.map(b => `<div class="row"><div class="l"><b>${esc(b.name)}</b><small>${esc(b.category || '')}${b.ended ? ' · ended ' + esc(C.fmtM(b.ended)) : ''}${b.link ? ' · linked to debts' : ''}</small></div><div class="num ${b.ended ? 'muted' : ''}">${C.gbp(b.amt)}</div></div>`).join('')}
      <div class="btnrow"><button class="btn ghost sm" data-act="toggle" data-key="editBills">${ui.editBills ? 'Done' : 'Edit bills'}</button>${ui.editBills ? '<button class="btn sm" data-act="addBill">Add bill</button>' : ''}</div>
      <div class="muted small" style="margin-top:8px">Price change? Overwrite the amount, or to keep history add a new row with a Started month and set Ended on the old one.</div>
      <div class="grid2" style="margin-top:10px">${field('Savings buffer kept back each month', inp('money.buffer', S.money.buffer))}</div></div>`;
    h += `<div class="card"><h2>Debt</h2><div class="row"><div class="l"><b>Total owed</b><small>${C.gbp(m.repayTotal)} a month in repayments</small></div><div class="strong num">${C.gbp(m.debtTotal)}</div></div>
      ${ui.editDebts ? m.debts.map((d, i) => `<div class="erow">${field('Debt', inp(`money.debts.${i}.name`, d.name, 'text'))}${field('Type', sel(`money.debts.${i}.type`, d.type, ['Short-term', 'Long-term']))}
          ${field('Balance', inp(`money.debts.${i}.balance`, d.balance))}${field('Monthly repayment', inp(`money.debts.${i}.repayment`, d.repayment))}
          ${field('APR % (optional)', pctInp(`money.debts.${i}.apr`, d.apr))}<div><button class="btn danger sm" data-act="delDebt" data-i="${i}">Remove</button></div></div>`).join('')
        : m.debts.map(d => `<div class="row"><div class="l"><b>${esc(d.name)}</b><small>${esc(d.type)} · ${C.gbp(d.repayment)}/month${d.payoff ? d.payoff.never ? ' · repayment below interest' : ' · clear by ' + esc(C.fmtM(d.payoff.date)) + (d.payoff.naive ? ' (no interest)' : '') : ''}</small></div><div class="num">${C.gbp(d.balance)}</div></div>`).join('')}
      <div class="btnrow"><button class="btn ghost sm" data-act="toggle" data-key="editDebts">${ui.editDebts ? 'Done' : 'Edit debts'}</button>${ui.editDebts ? '<button class="btn sm" data-act="addDebt">Add debt</button>' : ''}</div>
      <div class="muted small" style="margin-top:8px">Clear-by dates count from today. Without an APR they assume no interest — fine for 0% deals, optimistic for a mortgage.</div></div>`;
    return { title: 'Money', sub: m.latest ? 'latest: ' + C.fmtM(m.latest.month) : '', html: h };
  },

  lists() {
    const done = S.house.filter(j => j.status === 'Done').length, tot = S.house.length;
    let h = `<div class="card"><h2>House jobs</h2><div class="row"><div class="l"><b>${done} of ${tot} done</b></div><div class="num">${C.pct(tot ? done / tot : 0)}</div></div>${bar(tot ? done / tot : 0, 'amber')}
      <div style="margin-top:6px">${ui.editJobs ? S.house.map((j, i) => `<div class="erow"><div class="full">${field('Job', inp(`house.${i}.job`, j.job, 'text'))}</div>${field('Date done', inp(`house.${i}.dateDone`, j.dateDone, 'date'))}${field('Notes', inp(`house.${i}.notes`, j.notes, 'text'))}<div><button class="btn danger sm" data-act="delJob" data-i="${i}">Remove</button></div></div>`).join('')
        : S.house.map((j, i) => `<div class="row"><div class="l"><b style="${j.status === 'Done' ? 'color:var(--muted);text-decoration:line-through' : ''}">${esc(j.job)}</b><small>${j.dateDone ? esc(C.fmtD(j.dateDone)) : ''}${j.notes ? (j.dateDone ? ' · ' : '') + esc(j.notes) : ''}</small></div><button class="status ${j.status.replace(' ', '')}" data-act="cycle" data-i="${i}">${esc(j.status)}</button></div>`).join('')}</div>
      <div class="btnrow"><button class="btn ghost sm" data-act="toggle" data-key="editJobs">${ui.editJobs ? 'Done' : 'Edit jobs'}</button>${ui.editJobs ? '<button class="btn sm" data-act="addJob">Add job</button>' : ''}</div>
      <div class="muted small" style="margin-top:8px">Tap a status to move it on: To do → In progress → Done (sets today's date).</div></div>`;
    const cols = C.collections(S); const c = cols.find(x => x.key === ui.set) || cols[0];
    h += `<div class="card"><h2>Collections</h2><div class="chips">${cols.filter(x => x.key !== 'PSM demos').map(x => `<button class="chip ${x.key === c.key || (c.key === 'PSM demos' && x.key === 'PSM') ? 'on' : ''}" data-act="set" data-set="${esc(x.key)}">${esc(x.key === 'PSM' ? 'PSM' : x.label)}</button>`).join('')}</div>
      ${c.key.startsWith('PSM') ? cols.filter(x => x.key.startsWith('PSM')).map(x => `<div class="prow"><span><b>${esc(x.label)}</b></span><span class="num">${x.have} / ${x.total} · ${C.pct(x.pct)}</span>${bar(x.pct)}</div>`).join('') : `<div class="prow"><span><b>${esc(c.label)}</b></span><span class="num">${c.have} / ${c.total} · ${C.pct(c.pct)}</span>${bar(c.pct)}</div>`}
      <div class="field" style="margin:10px 0 4px"><input type="search" id="search" placeholder="Search…" value="${esc(ui.search)}"></div>
      <div id="ticklist">${tickList()}</div></div>`;
    return { title: 'Lists', sub: 'house jobs · collections', html: h };
  },

  games() {
    const g = C.gamesStats(S.games);
    const years = [...new Set(S.games.map(x => (x.date || '').slice(0, 4) || 'undated'))].sort().reverse();
    let h = `<div class="stats"><div class="stat"><b>${g.thisYear}</b><span>this year</span></div><div class="stat"><b>${g.lastYear}</b><span>last year</span></div><div class="stat"><b>${g.total}</b><span>all time</span></div></div>`;
    h += `<div class="card"><h2>Completed a game?</h2><div class="grid2"><div class="field" style="grid-column:1/-1"><label>Game</label><input type="text" id="g_name" placeholder="e.g. DOOM 64"></div>
      ${field('Date', `<input type="date" id="g_date" value="${C.today()}">`)}${field('Notes (optional)', `<input type="text" id="g_notes" placeholder="Easy · bad ending · again…">`)}</div>
      <div class="btnrow"><button class="btn teal" data-act="addGame">Add to log</button></div></div>`;
    h += `<div class="card"><h2>Goals</h2><div class="field"><textarea data-set="goals" rows="2">${esc(S.goals || '')}</textarea></div></div>`;
    h += `<div class="card"><h2>Log</h2>${years.map(y => { const list = S.games.filter(x => ((x.date || '').slice(0, 4) || 'undated') === y).sort((a, b) => (b.date || '').localeCompare(a.date || '')); return `<div class="yearhead">${esc(y)} · ${list.length}</div>${list.map(x => `<div class="row"><div class="l"><b>${esc(x.game)}</b><small>${x.date ? esc(C.fmtD(x.date)) : 'no date'}${x.notes ? ' · ' + esc(x.notes) : ''}</small></div><button class="del" data-act="delGame" data-id="${esc(x.id)}" aria-label="Remove">×</button></div>`).join('')}`; }).join('') || '<div class="empty">Nothing logged yet.</div>'}</div>`;
    return { title: 'Games', sub: g.last ? 'last: ' + g.last.game : '', html: h };
  }
};
const CATS = ['Housing', 'Utilities', 'Insurance', 'Transport', 'Phone', 'Subscriptions', 'Health & Fitness', 'Debt & Finance', 'Other'];

function stepper(label, payday, kind, val) {
  return `<div class="field"><label>${esc(label)}</label><div class="step"><button data-act="hstep" data-payday="${payday}" data-kind="${kind}" data-d="-1" aria-label="minus one">−</button><input type="number" inputmode="decimal" step="0.5" min="0" value="${val || ''}" placeholder="0" data-hours="${kind}" data-payday="${payday}"><button data-act="hstep" data-payday="${payday}" data-kind="${kind}" data-d="1" aria-label="plus one">+</button></div></div>`;
}
function fixedList(p) {
  const F = S.pay.fixed;
  const rows = ui.editFixed ? F.map((f, i) => `<div class="erow"><div class="full">${field('Item', inp(`pay.fixed.${i}.name`, f.name, 'text'))}</div>${field('£ per period', inp(`pay.fixed.${i}.amount`, f.amount))}${field('Treatment', sel(`pay.fixed.${i}.treatment`, f.treatment, ['Allowance', 'Sacrifice', 'After-tax']))}<div><button class="btn danger sm" data-act="delFixed" data-i="${i}">Remove</button></div></div>`).join('')
    : F.map(f => `<div class="row"><div class="l"><b>${esc(f.name)}</b><small>${esc(f.treatment)}</small></div><div class="num">${C.gbp(f.amount)}</div></div>`).join('');
  return `${rows}<div class="btnrow"><button class="btn ghost sm" data-act="toggle" data-key="editFixed">${ui.editFixed ? 'Done' : 'Edit items'}</button>${ui.editFixed ? '<button class="btn sm" data-act="addFixed">Add item</button>' : ''}</div>
    <div class="muted small" style="margin-top:8px">Allowance = taxed with pay · Sacrifice = off before tax and NI · After-tax = off net pay. Allowances ${C.gbp(p.allow)}, sacrifice ${C.gbp(p.sacr)}, after-tax ${C.gbp(p.after)} each period.</div>`;
}
function recent(n) {
  const list = S.games.filter(g => g.date).sort((a, b) => b.date.localeCompare(a.date)).slice(0, n);
  return list.length ? `<div class="eyebrow" style="margin-top:10px">Recent completions</div>${list.map(g => `<div class="row"><div class="l"><b>${esc(g.game)}</b></div><span class="muted small">${esc(C.fmtD(g.date))}</span></div>`).join('')}` : '';
}
function tickList() {
  const q = ui.search.trim().toLowerCase();
  const match = s => !q || String(s).toLowerCase().includes(q);
  if (ui.set === 'PSM' || ui.set === 'PSM demos') {
    const rows = S.psm.map((p, i) => ({ p, i })).filter(({ p }) => match(`${p.issue} ${p.titles} ${p.released || ''}`));
    return rows.map(({ p, i }) => `<div class="psm"><div><b>Issue ${p.issue}</b> <span class="muted small">${p.released ? esc(C.fmtM(p.released)) : ''}${p.demoNo != null && p.demoNo !== '' ? ' · demo ' + esc(p.demoNo) : ''}</span><div class="t">${esc(p.titles)}</div></div>
      <button class="box ${p.mag ? 'on' : ''}" data-act="psm" data-i="${i}" data-k="mag">MAG</button><button class="box ${p.demo ? 'on' : ''}" data-act="psm" data-i="${i}" data-k="demo">DISC</button></div>`).join('') || '<div class="empty">No matches.</div>';
  }
  const col = ui.set === 'Mega Evolution' ? 'mega' : 'classic';
  const items = S[col].map((c, i) => ({ c, i })).filter(({ c }) => (col === 'mega' || c.set === ui.set) && match(`${c.no || ''} ${c.card}`));
  return items.map(({ c, i }) => `<div class="tick ${c.have ? 'on' : ''}"><button class="box" data-act="tick" data-col="${col}" data-i="${i}" aria-label="toggle">${c.have ? '✓' : ''}</button><div class="name" data-act="tick" data-col="${col}" data-i="${i}">${c.no ? `<span class="mono muted">${esc(c.no)}</span> ` : ''}${esc(c.card)}</div><button class="g ${c.grade ? 'has' : ''}" data-act="grade" data-col="${col}" data-i="${i}">${c.grade ? esc(c.grade) : 'grade'}</button></div>`).join('') || '<div class="empty">No matches.</div>';
}

/* ---------- chart ---------- */
function drawChart() {
  const cv = $('#chart'); if (!cv) return;
  const m = C.moneyCalc(S.money); const data = m.last12; if (!data.length) return;
  const dpr = window.devicePixelRatio || 1, W = cv.clientWidth || 320, H = 170;
  cv.width = W * dpr; cv.height = H * dpr; const x = cv.getContext && cv.getContext('2d'); if (!x) return; x.scale(dpr, dpr);
  const max = Math.max(...data.map(d => C.num(d.earnings)), 1); const padL = 36, padB = 22, padT = 8, gw = (W - padL - 6) / data.length;
  x.font = '10px ' + getComputedStyle(document.body).fontFamily; x.fillStyle = '#6B7280'; x.strokeStyle = '#E3E8EF';
  const steps = 4; for (let i = 0; i <= steps; i++) { const v = max / steps * i, y = padT + (H - padT - padB) * (1 - v / max); x.beginPath(); x.moveTo(padL, y); x.lineTo(W, y); x.stroke(); x.textAlign = 'right'; x.fillText('£' + Math.round(v / 1000) + 'k', padL - 4, y + 3); }
  data.forEach((d, i) => {
    const x0 = padL + i * gw + gw * 0.15, bw = gw * 0.32;
    const he = (H - padT - padB) * C.num(d.earnings) / max, hd = (H - padT - padB) * Math.max(C.num(d.disposable), 0) / max;
    x.fillStyle = '#1F3A5F'; x.fillRect(x0, H - padB - he, bw, he);
    x.fillStyle = '#2A9D8F'; x.fillRect(x0 + bw + 2, H - padB - hd, bw, hd);
    x.fillStyle = '#6B7280'; x.textAlign = 'center'; if (data.length <= 12 || i % 2 === 0) x.fillText(C.fmtMs(d.month), x0 + bw, H - 6);
  });
}

/* ---------- render & events ---------- */
function render(keepScroll = true) {
  const y = window.scrollY; const v = VIEWS[tab]();
  $('#title').innerHTML = v.title; $('#sub').textContent = v.sub || ''; $('#view').innerHTML = v.html;
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  drawChart(); window.scrollTo(0, keepScroll ? y : 0);
}
function parseInput(el) {
  if (el.type === 'number') { if (el.value === '') return null; const v = parseFloat(el.value); if (isNaN(v)) return null; return el.dataset.kind === 'pct' ? v / 100 : v; }
  return el.value === '' ? null : el.value;
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const a = t.dataset.act, d = t.dataset;
  if (a === 'tab') { tab = d.tab; render(false); return; }
  if (a === 'pick') { ui.payIdx = +d.idx; render(false); return; }
  if (a === 'hstep') { const h = S.pay.hours[d.payday] = S.pay.hours[d.payday] || {}; h[d.kind] = Math.max(0, C.num(h[d.kind]) + (+d.d)); if (!h.ot && !h.sun) delete S.pay.hours[d.payday]; commit(); return; }
  if (a === 'toggle') { ui[d.key] = !ui[d.key]; render(); return; }
  if (a === 'set') { ui.set = d.set; ui.search = ''; render(); return; }
  if (a === 'tick') { const it = S[d.col][+d.i]; it.have = !it.have; commit(); return; }
  if (a === 'psm') { const it = S.psm[+d.i]; it[d.k] = !it[d.k]; commit(); return; }
  if (a === 'grade') { const it = S[d.col][+d.i]; const g = prompt(`Grade for ${it.card} (e.g. PSA 8) — leave blank for none`, it.grade || ''); if (g === null) return; it.grade = g.trim(); commit(); return; }
  if (a === 'cycle') { const j = S.house[+d.i]; const order = ['To do', 'In progress', 'Done']; j.status = order[(order.indexOf(j.status) + 1) % 3]; if (j.status === 'Done' && !j.dateDone) j.dateDone = C.today(); if (j.status === 'To do') j.dateDone = null; commit(); return; }
  if (a === 'addJob') { S.house.push({ id: uid(), job: '', status: 'To do', dateDone: null, notes: '' }); commit(); return; }
  if (a === 'delJob') { if (confirm('Remove this job?')) { S.house.splice(+d.i, 1); commit(); } return; }
  if (a === 'addBill') { S.money.bills.push({ id: uid(), name: '', category: 'Other', amount: null, started: C.mkey(C.today()), ended: null, link: null }); commit(); return; }
  if (a === 'delBill') { if (confirm('Remove this bill?')) { S.money.bills.splice(+d.i, 1); commit(); } return; }
  if (a === 'addDebt') { S.money.debts.push({ id: uid(), name: '', type: 'Short-term', balance: null, repayment: null, apr: null, notes: '' }); commit(); return; }
  if (a === 'delDebt') { if (confirm('Remove this debt?')) { S.money.debts.splice(+d.i, 1); commit(); } return; }
  if (a === 'addFixed') { S.pay.fixed.push({ name: '', amount: null, treatment: 'After-tax' }); commit(); return; }
  if (a === 'delFixed') { S.pay.fixed.splice(+d.i, 1); commit(); return; }
  if (a === 'addGame') { const n = $('#g_name').value.trim(); if (!n) { toast('Type the game first'); return; } S.games.push({ id: uid(), game: n, date: $('#g_date').value || null, notes: $('#g_notes').value.trim() }); commit(); toast('Added to log'); return; }
  if (a === 'delGame') { if (confirm('Remove this game from the log?')) { S.games = S.games.filter(g => g.id !== d.id); commit(); } return; }
  if (a === 'export') { exportBackup(); return; }
  if (a === 'copy') { (navigator.clipboard ? navigator.clipboard.writeText(JSON.stringify(S)) : Promise.reject()).then(() => toast('Backup copied — paste it somewhere safe'), () => toast('Copy not available here')); return; }
  if (a === 'reset') { if (confirm(SEED.generic ? 'Clear everything on this device? Restore a backup to get it back.' : 'Replace everything with the original spreadsheet data? Your changes on this device will be lost.')) { S = clone(SEED); normalize(); commit(); toast(SEED.generic ? 'Cleared' : 'Reset to spreadsheet data'); } return; }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'importFile') { if (el.files[0]) importBackup(el.files[0]); return; }
  if (el.dataset.hours) { const h = S.pay.hours[el.dataset.payday] = S.pay.hours[el.dataset.payday] || {}; h[el.dataset.hours] = Math.max(0, C.num(el.value)); if (!h.ot && !h.sun) delete S.pay.hours[el.dataset.payday]; commit(); return; }
  if (el.dataset.set) { setPath(S, el.dataset.set, parseInput(el)); commit(); }
});
document.addEventListener('input', e => { if (e.target.id === 'search') { ui.search = e.target.value; $('#ticklist').innerHTML = tickList(); } });
document.addEventListener('toggle', e => { if (e.target.dataset && e.target.dataset.key) ui.open[e.target.dataset.key] = e.target.open; }, true);
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'g_name') $('#g_notes').focus(); });

function exportBackup() {
  const blob = new Blob([JSON.stringify(S, null, 1)], { type: 'application/json' }); const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = `decs-stuff-${C.today()}.json`; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 800); toast('Backup downloaded');
}
function importBackup(file) {
  const rd = new FileReader();
  rd.onload = () => { try { const o = JSON.parse(rd.result); if (!o || !o.pay || !o.money) throw 0; S = o; normalize(); commit(); toast('Backup restored'); } catch (e) { toast("That file isn't a backup from this app"); } };
  rd.readAsText(file);
}
S = load(); normalize();
if (PAY_ONLY) { tab = 'pay'; document.querySelector('.tabs').style.display = 'none'; document.body.classList.add('notabs'); }
render(false);
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('./sw.js').catch(() => {});

</script>
